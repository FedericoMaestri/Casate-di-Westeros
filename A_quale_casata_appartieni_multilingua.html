 1}}, {"t": "Je l'enterrerais plus profondément encore", "w": {"Lannister": 2, "Frey": 2, "Hightower": 1, "Bolton": 1}}, {"t": "J'en ferais une légende encore plus grande", "w": {"Targaryen": 2, "Tyrell": 2, "Velaryon": 1, "Blackfyre": 1}}, {"t": "Rien ne changerait : le pouvoir, c'est le pouvoir", "w": {"Bolton": 1, "Greyjoy": 2, "Bracken": 1, "Clegane": 1}}]}, {"q": "L'hiver arrive et durera des années. Comment te prépares-tu ?", "a": [{"t": "Je remplis les greniers et j'organise chaque ressource avec méthode", "w": {"Stark": 3, "Tarly": 1, "Tully": 1}}, {"t": "J'achète tout ce qu'il faut, partout, à n'importe quel prix", "w": {"Lannister": 2, "Hightower": 2, "Frey": 1, "Velaryon": 1}}, {"t": "Je prendrai ce qu'il faut à ceux qui ne se sont pas préparés", "w": {"Greyjoy": 3, "Bracken": 1, "Bolton": 1}}, {"t": "L'hiver ne me fait pas peur : mon peuple est robuste", "w": {"Umber": 2, "Mormont": 2, "Stark": 1}}]}, {"q": "Lequel sonne le plus comme un compliment, et lequel comme une insulte ? Choisis ce qui te définit le mieux :", "a": [{"t": "\"Tu es prévisible\" — et c'est très bien ainsi, car je suis fiable", "w": {"Stark": 2, "Tully": 1, "Tarly": 2, "Mormont": 1}}, {"t": "\"Tu es impitoyable\" — et je le prends comme un fait, pas comme une accusation", "w": {"Bolton": 3, "Clegane": 1, "Greyjoy": 1}}, {"t": "\"Tu es imprévisible\" — exactement ce que je veux être", "w": {"Lannister": 1, "Tyrell": 2, "Martell": 1, "Bracken": 1, "Targaryen": 1}}, {"t": "\"Tu es têtu\" — appelle ça comme tu veux, je n'abandonne pas", "w": {"Umber": 2, "Blackwood": 1, "Bracken": 1, "Baratheon": 1, "Martell": 1}}]}, {"q": "Enfin : que voudrais-tu que les gens ressentent en prononçant ton nom ?", "a": [{"t": "Du respect et de la confiance", "w": {"Stark": 2, "Tully": 2, "Arryn": 1, "Mormont": 1, "Velaryon": 1}}, {"t": "De la crainte révérencieuse pour ma grandeur", "w": {"Targaryen": 2, "Hightower": 2, "Lannister": 1, "Tyrell": 1, "Blackfyre": 1}}, {"t": "Un frisson de peur", "w": {"Bolton": 2, "Clegane": 2, "Greyjoy": 1, "Bracken": 1}}, {"t": "La chaleur de savoir que je serai là", "w": {"Tully": 1, "Baratheon": 2, "Umber": 2, "Mormont": 1}}]}, {"q": "Un faucon se pose sur ton bras pendant un conseil tendu. Que fais-tu ?", "a": [{"t": "Je le laisse faire et je continue : le calme vaut plus que n'importe quel geste", "w": {"Arryn": 3, "Hightower": 1, "Stark": 1}}, {"t": "Je le caresse et je m'en sers pour désamorcer la tension à mon avantage", "w": {"Tyrell": 2, "Lannister": 1, "Martell": 1, "Arryn": 1}}, {"t": "Je le chasse : il n'y a pas de temps pour de telles distractions", "w": {"Tarly": 2, "Bolton": 1, "Baratheon": 1, "Clegane": 1}}, {"t": "Je pense que c'est un présage et j'essaie de l'interpréter", "w": {"Blackwood": 3, "Targaryen": 1, "Arryn": 1}}]}, {"q": "On te demande de garder une frontière lointaine et oubliée depuis des années. Toi ?", "a": [{"t": "J'accepte avec fierté : les frontières se défendent quand même", "w": {"Mormont": 2, "Umber": 2, "Arryn": 2, "Stark": 1}}, {"t": "J'essaie de l'échanger contre une charge plus visible", "w": {"Frey": 2, "Lannister": 1, "Tyrell": 1, "Hightower": 1}}, {"t": "J'en fais une base pour mes ambitions", "w": {"Bolton": 2, "Greyjoy": 1, "Bracken": 1, "Targaryen": 1, "Velaryon": 1, "Blackfyre": 2}}, {"t": "Je n'accepte que si cela protège vraiment quelqu'un qui compte pour moi", "w": {"Tully": 2, "Velaryon": 2, "Stark": 1, "Mormont": 1}}]}, {"q": "Tu as un seul vœu qui se réalisera à coup sûr. Lequel formules-tu ?", "a": [{"t": "Que mon peuple soit en sécurité pour des générations", "w": {"Stark": 2, "Tully": 2, "Mormont": 1, "Velaryon": 1, "Arryn": 1}}, {"t": "Que mon vieil ennemi tombe enfin", "w": {"Bracken": 2, "Blackwood": 2, "Clegane": 2, "Martell": 1, "Blackfyre": 2}}, {"t": "Que mon nom devienne immortel", "w": {"Targaryen": 2, "Lannister": 1, "Hightower": 2, "Tyrell": 1, "Blackfyre": 1}}, {"t": "La mer ouverte et aucun maître au-dessus de moi", "w": {"Greyjoy": 3, "Velaryon": 2, "Baratheon": 1}}]}], "houses": {"Stark": {"motto": "L'hiver vient", "sigil": "Un loup-garou gris sur fond blanc glace", "blurb": "Anciens rois du Nord, fidèles aux anciens dieux et à un honneur aussi rigoureux que la neige. Pour toi, le devoir n'est pas un choix mais l'ossature même de qui tu es : tu prononces la sentence et tiens toi-même l'épée. Tu te méfies de la cour du Sud et de ses intrigues, et ta place sera toujours entre tes propres murs, aux côtés des tiens."}, "Lannister": {"motto": "Je rugis !", "sigil": "Un lion doré sur fond pourpre", "blurb": "Descendant de Lann le Rusé, aussi riche que les mines de Castral Roc. Tu tiens le compte de chaque dette et de chaque créance, et un Lannister paie toujours ses dettes — en or ou autrement. Patience, orgueil et calcul : tu laisses les autres te croire prévisible pendant que ton plan mûrit dans l'ombre."}, "Targaryen": {"motto": "Feu et sang", "sigil": "Un dragon tricéphale rouge sur fond noir", "blurb": "Sang de l'antique Valyria, habitué à regarder le monde d'en haut. L'ambition coule dans tes veines comme le feu : tu veux un nom que le temps ne pourra effacer. Les prophéties et les grands exploits t'appellent, et ce que tu désires vraiment, tu le prends."}, "Arryn": {"motto": "Aussi haute qu'Honneur", "sigil": "Un faucon blanc et une lune sur fond bleu ciel", "blurb": "Seigneur du Nid d'Aigle, l'imprenable château parmi les nuages. Prudent, patient, jaloux de ta sécurité : tu n'ouvres pas les portes closes sans bonne raison et tu ne prends pas de risques inutiles. Pour toi, l'honneur est une altitude — quelque chose vers quoi l'on tend, non un geste ostentatoire."}, "Tyrell": {"motto": "Plus haut, plus fort", "sigil": "Une rose dorée sur fond vert prairie", "blurb": "Montés du rang d'intendants au trône de Hautjardin grâce à la courtoisie et au talent. Tu sais que l'affection du peuple est un pouvoir et qu'un sourire désarme plus qu'une épée. Tu cultives tes alliances comme on cultive un jardin : avec patience, élégance et un œil toujours attentif à ce qui va fleurir."}, "Martell": {"motto": "Insoumis, invaincus, intacts", "sigil": "Un soleil rouge transpercé d'une lance", "blurb": "Princes de Dorne, indomptés sous leur soleil féroce. Aucun dragon ne vous a jamais fait plier. Fier et indépendant, tu n'oublies jamais un tort et sers ta vengeance froide, quand le moment est parfait. Tu fixes tes propres règles, et ne t'agenouilles jamais devant qui ne le mérite pas."}, "Baratheon": {"motto": "Nôtre est la fureur", "sigil": "Un cerf couronné noir sur fond d'or", "blurb": "Fort comme la tempête qui frappe Accalmie. Tu affrontes tout de front : la bataille, l'insulte, la vie elle-même. Courageux, franc, incapable de feindre — tu préfères une seule bataille décisive, face à face, à mille intrigues. Tu bois, tu ris et tu combats de tout ton cœur."}, "Tully": {"motto": "Famille, devoir, honneur", "sigil": "Une truite argentée sur fond bleu et rouge", "blurb": "Seigneurs de Vivesaigues, là où les rivières se rencontrent. Pour toi, les gens passent avant tout : tu ouvres les greniers en cas de famine, gardes les secrets, mets fin aux querelles. La famille n'est pas seulement le sang, mais tous ceux qui dépendent de toi — et tu ne les déçois jamais."}, "Greyjoy": {"motto": "Nous ne semons pas", "sigil": "Une pieuvre dorée sur fond noir", "blurb": "Hommes de fer des îles, fiers de leur liberté farouche. Tu ne sèmes pas : tu prends ce dont tu as besoin à la mer et à ceux trop faibles pour le garder. Le foyer, c'est le pont de ton navire, et ce qui est mort ne saurait jamais périr. Aucun maître, aucune chaîne."}, "Hightower": {"motto": "Nous éclairons la voie", "sigil": "Une tour de pierre couronnée de flammes sur fond gris", "blurb": "La maison la plus ancienne et la plus riche de Villevieille, gardienne de la Citadelle et du savoir. Prudent et pieux, tu ouvres les portes quand la force est inutile et tu tiens tes livres comme d'autres tiennent leurs épées. Tu sais que le savoir patient survit à tout conquérant."}, "Velaryon": {"motto": "L'ancien, le vrai, le courageux", "sigil": "Un hippocampe argenté sur fond bleu marin", "blurb": "Sang valyrien ancien, lié à la mer plus qu'à la terre. Tu explores le premier les routes périlleuses, bâtissant des flottes qui portent ton nom au-delà de l'horizon. Loyal et courageux, ton foyer est partout où te porte la marée, et ta richesse vient des vagues."}, "Bolton": {"motto": "Nos lames sont aiguisées", "sigil": "Un homme écorché sur fond rose sang", "blurb": "Anciens seigneurs de Fort-Terreur, à la réputation aussi redoutée qu'ancienne. Froid, patient, calculateur : un homme nu a peu de secrets, dis-tu, et tu t'y connais. Tu ne montres jamais de faiblesse, n'accordes jamais de pitié gratuite, et laisses ton nom faire le travail de la peur."}, "Tarly": {"motto": "Premiers au combat", "sigil": "Un chasseur à grands pas sur fond vert et argent", "blurb": "Seigneurs de Corcolline, réputés pour leur discipline martiale. Pour toi, l'ordre, l'entraînement et la stratégie gagnent les guerres. Sévère avec toi-même avant de l'être avec les autres, tu trempes tes héritiers par des épreuves dures et commandes la manœuvre pendant que d'autres cherchent la gloire du premier rang."}, "Mormont": {"motto": "Ici nous nous tenons debout", "sigil": "Un ours noir sur fond vert", "blurb": "De la rude Île aux Ours, où même les femmes brandissent l'épée sans que personne n'y trouve à redire. Franc, loyal, infatigable : ce qui compte pour toi, c'est ce que l'on fait, non d'où l'on vient. Tu supportes la douleur sans te plaindre, défends les frontières oubliées, et tiens ta position quoi qu'il arrive."}, "Clegane": {"motto": "(pas de devise noble — juste trois chiens noirs sur fond jaune)", "sigil": "Trois chiens noirs sur fond jaune", "blurb": "Une maison jeune et violente, élevée à servir par la force brute. Tu réponds à l'insulte à coups de poing, enfonces les portes au lieu de les contourner, et utilises la douleur comme carburant pour ta colère. Direct jusqu'à la brutalité, tu méprises les subtilités et la fausse courtoisie de la cour."}, "Bracken": {"motto": "Nul ne sait laquelle (la rivalité est éternelle)", "sigil": "Un cheval rouge et un soleil doré sur fond brun", "blurb": "Seigneurs des Conflans, liés par une querelle ancienne et inextinguible avec les Blackwood. Impulsif, orgueilleux, incapable de laisser passer un tort : certaines rancunes durent aussi longtemps que ton nom. Tu affrontes tes ennemis ouvertement, et ce qui te brûle le plus, c'est de les voir, eux entre tous, l'emporter."}, "Blackwood": {"motto": "(gardiens des anciens dieux et du barral)", "sigil": "Une nuée de corbeaux et un barral sur fond rouge", "blurb": "Anciens seigneurs des Conflans, fidèles aux anciens dieux et ennemis jurés des Bracken. Tu lis les présages, écoutes le silence des arbres et n'oublies jamais une offense. Tu frappes là où l'on ne t'attend pas et portes tes rancunes avec le même soin que tu gardes les vieilles traditions."}, "Umber": {"motto": "(la force brute du Grand Jon)", "sigil": "Un géant brisant des chaînes sur fond argent", "blurb": "Vassaux des Stark venus de l'extrême Nord, énormes, bruyants et féroces. Têtu et impulsif, tu dis les choses comme elles sont et affrontes la vie de front. Tu apprends à manier une arme avant même de savoir lire, et ta loyauté, une fois donnée, est aussi inébranlable que la glace."}, "Frey": {"motto": "(pas de devise ancienne — ils se sont élevés grâce au Passage)", "sigil": "Deux tours reliées par un pont sur fond d'argent et de bleu", "blurb": "Seigneurs du Passage, maîtres des Jumeaux et de tous ceux qui veulent traverser la rivière. Opportuniste et tenace, tu tiens un compte précis de chaque faveur et de chaque affront. Tu sais que tu n'as pas le sang le plus ancien, et c'est justement pour cela que tu ne laisses jamais échapper une occasion de t'élever."}, "Blackfyre": {"motto": "(le dragon noir — les couleurs Targaryen inversées)", "sigil": "Un dragon noir tricéphale sur fond rouge", "blurb": "Sang du dragon, mais né du mauvais côté de la succession : tu descends de Daemon Blackfyre, le bâtard légitimé qui brandit l'épée du Conquérant et revendiqua un trône qu'il croyait sien de droit. Fier et implacable, tu portes le poids d'une exclusion qui brûle depuis des générations. Quatre rébellions échouées n'ont pas éteint ta conviction : l'exil au-delà de la Mer Étroite, la Compagnie Dorée à tes côtés, et une rancune qui ne connaît pas la reddition. Ce qui t'a été refusé, tu reviendras le réclamer."}}}, "es": {"quiz": [{"q": "Un huésped llega a tu puerta durante una tormenta. No lo conoces, y se rumorea que es un enemigo. ¿Qué haces?", "a": [{"t": "Lo recibo: el pan y la sal no se niegan a nadie", "w": {"Stark": 3, "Tully": 2, "Umber": 2, "Mormont": 1}}, {"t": "Lo recibo, pero hago que lo vigilen a cada paso", "w": {"Bolton": 3, "Frey": 2, "Lannister": 1, "Hightower": 1}}, {"t": "Lo recibo y lo pongo cómodo: un enemigo desarmado es el más fácil de escuchar", "w": {"Tyrell": 3, "Martell": 2, "Lannister": 1}}, {"t": "Yo decido las reglas bajo mi propio techo, sea huésped o no", "w": {"Greyjoy": 3, "Baratheon": 1, "Bracken": 1}}]}, {"q": "Te ofrecen un puesto de poder en la corte, lejos de casa. ¿Aceptas?", "a": [{"t": "No, mi lugar está en mis tierras", "w": {"Stark": 3, "Mormont": 2, "Arryn": 1}}, {"t": "Sí, cerca del rey se decide el destino del reino", "w": {"Lannister": 3, "Tyrell": 2, "Hightower": 1, "Frey": 1}}, {"t": "Solo si me garantiza proteger mejor a los míos", "w": {"Tully": 3, "Velaryon": 1, "Tarly": 1}}, {"t": "Lo aceptaría de todos modos, y lo usaría a mi manera", "w": {"Targaryen": 2, "Baratheon": 2, "Bracken": 2, "Blackfyre": 2}}]}, {"q": "¿Qué sonido prefieres oír al despertar?", "a": [{"t": "El viento entre los árboles y el silencio", "w": {"Stark": 3, "Blackwood": 2, "Arryn": 1}}, {"t": "Las olas golpeando el casco", "w": {"Greyjoy": 3, "Velaryon": 3}}, {"t": "El bullicio de un castillo despertando para servirme", "w": {"Lannister": 2, "Tyrell": 2, "Frey": 1, "Hightower": 1}}, {"t": "Perros ladrando en las perreras", "w": {"Clegane": 3, "Bolton": 2, "Bracken": 1}}]}, {"q": "Uno de tus vasallos te ha traicionado. Está en tu poder. ¿Cómo procedes?", "a": [{"t": "Ejecuto la sentencia yo mismo: quien dicta la condena debe empuñar la espada", "w": {"Stark": 3, "Mormont": 2, "Umber": 1}}, {"t": "Hago que dure mucho, para que otros aprendan", "w": {"Bolton": 3, "Clegane": 2}}, {"t": "Lo perdono públicamente y me sirvo de él para siempre", "w": {"Tyrell": 2, "Lannister": 2, "Martell": 1, "Frey": 1}}, {"t": "Lo ahogo: el Dios Ahogado toma lo que le corresponde", "w": {"Greyjoy": 3}}]}, {"q": "¿Cuál te parece la peor de las humillaciones?", "a": [{"t": "Arrodillarme ante quien no lo merece", "w": {"Martell": 3, "Greyjoy": 2, "Blackwood": 1, "Baratheon": 1}}, {"t": "Ser considerado un advenedizo, sin verdadero linaje", "w": {"Tyrell": 2, "Hightower": 2, "Frey": 2}}, {"t": "Ver que mi propio nombre cae en el olvido", "w": {"Targaryen": 2, "Lannister": 2, "Velaryon": 1, "Blackfyre": 2}}, {"t": "Ser tratado como un necio cuando soy el más fuerte", "w": {"Clegane": 2, "Umber": 2, "Bracken": 2}}]}, {"q": "Tienes una noche libre sin deberes. ¿Cómo la pasas?", "a": [{"t": "Con un libro raro y una vela", "w": {"Hightower": 3, "Tyrell": 1, "Lannister": 1}}, {"t": "Entrenando hasta que los brazos me fallen", "w": {"Tarly": 2, "Mormont": 2, "Baratheon": 2, "Clegane": 1}}, {"t": "Bebiendo y cantando con quienes me son leales", "w": {"Baratheon": 2, "Umber": 2, "Tully": 1, "Bracken": 1}}, {"t": "Contemplando el horizonte y planeando el próximo viaje", "w": {"Velaryon": 3, "Targaryen": 1, "Greyjoy": 1}}]}, {"q": "¿Qué cualidad valoras más en quienes te sirven?", "a": [{"t": "Lealtad absoluta, incluso en el error", "w": {"Stark": 2, "Tully": 2, "Mormont": 2, "Umber": 1}}, {"t": "Competencia fría, sin necesidad de afecto", "w": {"Bolton": 3, "Tarly": 2, "Hightower": 1}}, {"t": "La capacidad de ser útil sin volverse jamás imprescindible", "w": {"Lannister": 2, "Frey": 2, "Tyrell": 1}}, {"t": "Valor físico, cueste lo que cueste", "w": {"Baratheon": 2, "Clegane": 2, "Greyjoy": 1, "Bracken": 1}}]}, {"q": "Una vieja enemistad familiar podría por fin cerrarse con un matrimonio. ¿Tú?", "a": [{"t": "La cierro: la sangre derramada no vale más sangre", "w": {"Tully": 2, "Stark": 2, "Velaryon": 1}}, {"t": "La cierro solo en apariencia, y mantengo viva la desconfianza", "w": {"Frey": 3, "Bolton": 1, "Lannister": 1}}, {"t": "Jamás la cerraría: ciertos agravios no se olvidan", "w": {"Blackwood": 3, "Bracken": 3, "Martell": 1}}, {"t": "La uso para conseguir algo más grande", "w": {"Tyrell": 2, "Hightower": 2, "Targaryen": 1}}]}, {"q": "¿Cómo reaccionas ante un insulto público?", "a": [{"t": "Con calma glacial: quien insulta ya se ha delatado", "w": {"Bolton": 2, "Hightower": 2, "Arryn": 1, "Stark": 1}}, {"t": "Respondo de inmediato, a puñetazos si hace falta", "w": {"Clegane": 2, "Umber": 2, "Baratheon": 2, "Bracken": 1}}, {"t": "Sonrío y tomo nota para después", "w": {"Lannister": 2, "Tyrell": 2, "Martell": 1, "Frey": 1}}, {"t": "Lo ignoro: mi nombre habla por sí solo", "w": {"Targaryen": 2, "Martell": 2, "Velaryon": 1}}]}, {"q": "¿Qué paisaje sientes más \"tuyo\"?", "a": [{"t": "Bosques nevados y cielos grises", "w": {"Stark": 3, "Umber": 2, "Mormont": 1}}, {"t": "Costas rocosas azotadas por el mar", "w": {"Greyjoy": 3, "Velaryon": 2, "Arryn": 1}}, {"t": "Campos dorados y jardines en flor", "w": {"Tyrell": 3, "Tully": 1}}, {"t": "Desierto rojo bajo un sol feroz", "w": {"Martell": 3}}]}, {"q": "Debes elegir un arma para el resto de tu vida. ¿Cuál?", "a": [{"t": "Un mandoble a dos manos que exige fuerza pura", "w": {"Clegane": 2, "Umber": 2, "Baratheon": 2, "Tarly": 1}}, {"t": "Un arco largo, para golpear antes de ser visto", "w": {"Blackwood": 2, "Bracken": 1, "Tarly": 1, "Bolton": 1}}, {"t": "Una hoja fina y veloz", "w": {"Martell": 2, "Lannister": 1, "Targaryen": 1}}, {"t": "El hacha y la nave que me lleva hasta el enemigo", "w": {"Greyjoy": 3, "Velaryon": 1}}]}, {"q": "Un juglar escribe una balada sobre ti. ¿Qué esperas que diga?", "a": [{"t": "Que cumplí con mi deber hasta el final", "w": {"Stark": 3, "Tully": 2, "Tarly": 1, "Mormont": 1}}, {"t": "Que nadie logró jamás doblegarme", "w": {"Martell": 3, "Greyjoy": 2, "Blackwood": 1}}, {"t": "Que fui el más astuto de todos", "w": {"Lannister": 3, "Frey": 1, "Tyrell": 1}}, {"t": "Que mi nombre infundía terror", "w": {"Bolton": 3, "Clegane": 2, "Targaryen": 1}}]}, {"q": "¿Cuánto te importa el dinero?", "a": [{"t": "Es una herramienta: lo acumulo y lo hago fructificar", "w": {"Lannister": 3, "Hightower": 1, "Frey": 1}}, {"t": "Importa menos que la tierra y el nombre", "w": {"Stark": 2, "Arryn": 2, "Mormont": 2}}, {"t": "Lo tomo donde lo encuentro, no lo cultivo", "w": {"Greyjoy": 3, "Bracken": 1}}, {"t": "Sirve para financiar ambiciones más grandes que él mismo", "w": {"Targaryen": 2, "Velaryon": 2, "Baratheon": 1, "Tyrell": 1}}]}, {"q": "Un niño de tu casa muestra crueldad hacia los animales. ¿Cómo reaccionas?", "a": [{"t": "Lo corrijo con dureza: la crueldad gratuita es debilidad", "w": {"Stark": 2, "Tarly": 2, "Tully": 1, "Mormont": 1}}, {"t": "Observo: quizás entienda algo que los demás no ven", "w": {"Bolton": 3, "Clegane": 1}}, {"t": "Lo educo para que la canalice donde sea útil", "w": {"Lannister": 1, "Targaryen": 1, "Bracken": 1, "Hightower": 1}}, {"t": "No me ocupo de ello: aprenderá de la vida", "w": {"Greyjoy": 2, "Umber": 1, "Baratheon": 1}}]}, {"q": "Preferirías ser...", "a": [{"t": "Temido", "w": {"Bolton": 3, "Targaryen": 1, "Clegane": 1, "Blackfyre": 1}}, {"t": "Respetado", "w": {"Stark": 2, "Arryn": 2, "Tarly": 2, "Hightower": 1}}, {"t": "Amado", "w": {"Tully": 2, "Tyrell": 2, "Baratheon": 1, "Mormont": 1}}, {"t": "Libre", "w": {"Greyjoy": 3, "Martell": 2, "Blackwood": 1}}]}, {"q": "Tu heredero no está capacitado para gobernar. ¿Qué haces?", "a": [{"t": "Lo preparo de todos modos: la sangre es la sangre", "w": {"Frey": 2, "Targaryen": 2, "Lannister": 1, "Velaryon": 1, "Blackfyre": 2}}, {"t": "Confío el poder a quien sea capaz, aunque esté fuera del linaje", "w": {"Tyrell": 2, "Hightower": 2, "Martell": 1}}, {"t": "Lo templo con pruebas duras hasta que madure", "w": {"Tarly": 2, "Bolton": 2, "Umber": 1, "Mormont": 1}}, {"t": "Dejo que fracase y que prevalezca el más fuerte", "w": {"Greyjoy": 2, "Baratheon": 2, "Bracken": 1}}]}, {"q": "¿Qué piensas de las viejas tradiciones?", "a": [{"t": "Son lo que somos: hay que defenderlas a toda costa", "w": {"Stark": 2, "Greyjoy": 2, "Martell": 1, "Hightower": 1}}, {"t": "Útiles mientras sirven, olvidables cuando pesan", "w": {"Lannister": 2, "Tyrell": 2, "Frey": 1}}, {"t": "Antiguas y sagradas, pero también un arma que blandir", "w": {"Bolton": 2, "Targaryen": 2, "Bracken": 1, "Blackwood": 1, "Blackfyre": 2}}, {"t": "Las respeto si han superado la prueba del tiempo", "w": {"Arryn": 2, "Tully": 2, "Velaryon": 1, "Tarly": 1}}]}, {"q": "En batalla, ¿dónde te encuentran?", "a": [{"t": "En primera línea, donde la refriega es más intensa", "w": {"Umber": 2, "Baratheon": 2, "Clegane": 2, "Mormont": 1}}, {"t": "En el flanco, dirigiendo la maniobra", "w": {"Tarly": 3, "Bolton": 1, "Hightower": 1}}, {"t": "Donde nadie me espera, a espaldas del enemigo", "w": {"Bracken": 1, "Blackwood": 1, "Lannister": 1, "Greyjoy": 1, "Bolton": 1}}, {"t": "En lo alto, donde de verdad se decide la guerra", "w": {"Targaryen": 3, "Velaryon": 1, "Blackfyre": 2}}]}, {"q": "¿Cuál es tu relación con los dioses?", "a": [{"t": "Rezo a los Antiguos Dioses, en silencio, ante los árboles", "w": {"Stark": 3, "Blackwood": 2, "Mormont": 1}}, {"t": "Honro a los Siete con devoción y ceremonia", "w": {"Tyrell": 2, "Hightower": 3, "Tully": 1, "Arryn": 1}}, {"t": "Sirvo a un dios que pide y que toma", "w": {"Greyjoy": 3}}, {"t": "Los dioses son útiles a los hombres, no al revés", "w": {"Lannister": 2, "Bolton": 2, "Frey": 1, "Bracken": 1}}]}, {"q": "Te dicen que te equivocaste. ¿Cómo lo tomas?", "a": [{"t": "Lo admito y lo corrijo: el orgullo no vale más que la verdad", "w": {"Stark": 2, "Tarly": 2, "Tully": 1}}, {"t": "Rara vez lo admito en público", "w": {"Lannister": 2, "Targaryen": 2, "Martell": 1, "Arryn": 1, "Blackfyre": 1}}, {"t": "Depende de quién me lo diga", "w": {"Frey": 2, "Bolton": 1, "Hightower": 1, "Bracken": 1}}, {"t": "Estallo de furia antes de razonarlo", "w": {"Baratheon": 2, "Clegane": 2, "Umber": 2, "Greyjoy": 1}}]}, {"q": "¿Qué salvarías de un castillo en llamas?", "a": [{"t": "Los escritos y el conocimiento", "w": {"Hightower": 3, "Lannister": 1, "Targaryen": 1}}, {"t": "La espada de la familia", "w": {"Stark": 2, "Tarly": 2, "Mormont": 2, "Umber": 1}}, {"t": "A las personas, antes que cualquier objeto", "w": {"Tully": 3, "Mormont": 1, "Baratheon": 1}}, {"t": "El oro y los contratos", "w": {"Lannister": 2, "Frey": 3}}]}, {"q": "¿Cómo tratas a quien te debe un favor?", "a": [{"t": "No se lo recuerdo: la generosidad ata más que la deuda", "w": {"Tyrell": 2, "Tully": 2, "Velaryon": 1}}, {"t": "Llevo la cuenta exacta, y la cobro en el momento oportuno", "w": {"Lannister": 3, "Frey": 2}}, {"t": "Una deuda de honor debe saldarse, de un modo u otro", "w": {"Stark": 1, "Martell": 2, "Bracken": 1, "Blackwood": 1}}, {"t": "La uso como palanca, mientras pueda", "w": {"Bolton": 2, "Hightower": 1, "Targaryen": 1}}]}, {"q": "¿Qué te pesa más?", "a": [{"t": "Quedarme quieto cuando podría actuar", "w": {"Baratheon": 2, "Targaryen": 2, "Bracken": 1, "Greyjoy": 1}}, {"t": "Actuar por impulso y arrepentirme después", "w": {"Hightower": 2, "Arryn": 2, "Tarly": 1, "Bolton": 1}}, {"t": "Decepcionar a quien cuenta conmigo", "w": {"Stark": 2, "Tully": 2, "Mormont": 1, "Velaryon": 1}}, {"t": "Ser superado en astucia", "w": {"Lannister": 2, "Tyrell": 2, "Frey": 1}}]}, {"q": "Una mujer de tu casa quiere comandar hombres armados. ¿Tú?", "a": [{"t": "Le doy una espada y basta de dudas", "w": {"Mormont": 3, "Martell": 1, "Greyjoy": 1}}, {"t": "La apoyo si es capaz", "w": {"Stark": 1, "Targaryen": 2, "Tyrell": 1, "Velaryon": 1}}, {"t": "Prefiero vías más discretas para su poder", "w": {"Lannister": 2, "Hightower": 2, "Frey": 1}}, {"t": "La tradición dice otra cosa, y la tradición importa", "w": {"Tully": 1, "Arryn": 2, "Tarly": 2, "Bracken": 1}}]}, {"q": "¿Qué significa \"hogar\" para ti?", "a": [{"t": "Los muros donde crecí y los muertos allí enterrados", "w": {"Stark": 3, "Arryn": 1, "Mormont": 1}}, {"t": "Las personas, dondequiera que estén", "w": {"Tully": 3, "Baratheon": 1}}, {"t": "El nombre y todo lo que se le debe", "w": {"Lannister": 2, "Hightower": 2, "Targaryen": 1, "Frey": 1}}, {"t": "La cubierta del barco: el hogar es adonde voy", "w": {"Greyjoy": 3, "Velaryon": 2}}]}, {"q": "Un rival más débil está a tu merced, implorando piedad. ¿Tú?", "a": [{"t": "Concedo la piedad: aplastar a los débiles no da gloria", "w": {"Stark": 1, "Tully": 2, "Mormont": 2, "Baratheon": 1}}, {"t": "La concedo, pero a un precio que pagará durante mucho tiempo", "w": {"Lannister": 2, "Frey": 2, "Hightower": 1}}, {"t": "La piedad es un lujo que el enemigo no se ha ganado", "w": {"Bolton": 3, "Clegane": 2, "Greyjoy": 1}}, {"t": "Decido según lo que me convenga mañana", "w": {"Tyrell": 2, "Targaryen": 1, "Bracken": 1, "Martell": 1}}]}, {"q": "¿Cuál de estos defectos reconoces más fácilmente en ti?", "a": [{"t": "Soy demasiado rígido", "w": {"Stark": 2, "Tarly": 2, "Arryn": 1}}, {"t": "Soy demasiado orgulloso", "w": {"Martell": 2, "Targaryen": 2, "Lannister": 1, "Baratheon": 1}}, {"t": "Soy demasiado calculador", "w": {"Frey": 2, "Bolton": 2, "Hightower": 1, "Lannister": 1}}, {"t": "Soy demasiado impulsivo", "w": {"Umber": 2, "Clegane": 2, "Greyjoy": 1, "Bracken": 1}}]}, {"q": "¿Cómo eliges a tus aliados?", "a": [{"t": "Por una confianza probada a lo largo de los años", "w": {"Stark": 2, "Tully": 2, "Velaryon": 1}}, {"t": "Por lo que pueden darme ahora", "w": {"Frey": 3, "Lannister": 1, "Bracken": 1}}, {"t": "Por quienes odian a mis mismos enemigos", "w": {"Blackwood": 2, "Martell": 2, "Bracken": 1, "Umber": 1}}, {"t": "Por el prestigio que me aportan", "w": {"Tyrell": 2, "Hightower": 2, "Targaryen": 1}}]}, {"q": "Un maestre te ofrece estudiar a fondo una sola disciplina. ¿Cuál?", "a": [{"t": "Historia y archivos", "w": {"Hightower": 3, "Lannister": 1}}, {"t": "Estrategia militar", "w": {"Tarly": 3, "Bolton": 1, "Baratheon": 1}}, {"t": "Navegación y mares lejanos", "w": {"Velaryon": 3, "Greyjoy": 1}}, {"t": "El arte de leer a las personas", "w": {"Tyrell": 2, "Lannister": 1, "Martell": 1, "Frey": 1}}]}, {"q": "¿Tu reacción ante una gran injusticia sufrida por otros?", "a": [{"t": "Intervengo, aunque sea a mi propio riesgo", "w": {"Baratheon": 2, "Stark": 2, "Mormont": 1, "Umber": 1}}, {"t": "Evalúo si intervenir me conviene", "w": {"Frey": 2, "Lannister": 2, "Hightower": 1}}, {"t": "La recuerdo, y espero el momento de enderezarla", "w": {"Martell": 2, "Blackwood": 2, "Bracken": 1, "Bolton": 1}}, {"t": "No son asuntos míos mientras no toquen a los míos", "w": {"Greyjoy": 2, "Arryn": 2, "Velaryon": 1}}]}, {"q": "¿Qué legado te gustaría dejar?", "a": [{"t": "Tierras intactas y un nombre sin mancha", "w": {"Stark": 2, "Arryn": 2, "Tarly": 1}}, {"t": "Una dinastía que dure mil años", "w": {"Lannister": 2, "Targaryen": 2, "Hightower": 1, "Frey": 1, "Blackfyre": 1}}, {"t": "Una flota y rutas que lleven mi nombre lejos", "w": {"Velaryon": 3, "Greyjoy": 2}}, {"t": "El recuerdo de quien nunca se rindió", "w": {"Martell": 2, "Blackwood": 1, "Umber": 1, "Baratheon": 1}}]}, {"q": "Te das cuenta de que un igual tuyo hace trampa en un juego importante. ¿Tú?", "a": [{"t": "Lo desenmascaro delante de todos", "w": {"Stark": 2, "Baratheon": 2, "Umber": 1, "Tully": 1}}, {"t": "Lo dejo hacer y aprendo sus trucos", "w": {"Lannister": 2, "Bolton": 2, "Hightower": 1}}, {"t": "Hago trampa mejor que él", "w": {"Frey": 2, "Tyrell": 1, "Bracken": 1, "Targaryen": 1}}, {"t": "Volteo la mesa", "w": {"Clegane": 3, "Greyjoy": 1}}]}, {"q": "¿Qué piensas del perdón?", "a": [{"t": "Es fortaleza, no debilidad", "w": {"Tully": 2, "Stark": 1, "Tyrell": 1, "Baratheon": 1}}, {"t": "Solo debe concederse cuando sirve a un propósito", "w": {"Lannister": 2, "Hightower": 2, "Frey": 1}}, {"t": "Hay cosas que nunca se perdonan", "w": {"Bracken": 2, "Blackwood": 2, "Martell": 2, "Bolton": 1, "Blackfyre": 2}}, {"t": "Perdonar es olvidar, y yo no olvido", "w": {"Greyjoy": 1, "Umber": 1, "Targaryen": 1}}]}, {"q": "Un dragón, un corcel o una nave: ¿cuál elegirías poseer?", "a": [{"t": "El dragón", "w": {"Targaryen": 3, "Baratheon": 1}}, {"t": "La nave", "w": {"Velaryon": 3, "Greyjoy": 2}}, {"t": "El corcel", "w": {"Bracken": 2, "Tarly": 1, "Umber": 1, "Stark": 1}}, {"t": "Ninguno: preferiría una biblioteca", "w": {"Hightower": 3, "Lannister": 1}}]}, {"q": "¿Cómo reaccionas cuando alguien duda de tu palabra?", "a": [{"t": "Mi palabra es un juramento: dudar de ella me ofende", "w": {"Stark": 2, "Mormont": 2, "Tarly": 1, "Tully": 1}}, {"t": "Me divierte: que duden, mientras yo actúe sin que me molesten", "w": {"Lannister": 2, "Tyrell": 2, "Frey": 1}}, {"t": "Se lo hago lamentar", "w": {"Clegane": 2, "Bolton": 2, "Bracken": 1, "Umber": 1}}, {"t": "Mi palabra vale lo que a mí me convenga que valga", "w": {"Greyjoy": 2, "Frey": 2, "Targaryen": 1}}]}, {"q": "¿Ante una puerta cerrada que no deberías abrir?", "a": [{"t": "No la abro: si está cerrada, hay un motivo", "w": {"Arryn": 2, "Tarly": 2, "Hightower": 1, "Stark": 1}}, {"t": "La abro: quiero saber", "w": {"Targaryen": 2, "Blackwood": 1, "Lannister": 1, "Bracken": 1}}, {"t": "La derribo si se interpone entre yo y lo que quiero", "w": {"Clegane": 2, "Umber": 2, "Greyjoy": 2, "Baratheon": 1}}, {"t": "Busco otra forma de descubrir qué hay detrás", "w": {"Tyrell": 1, "Bolton": 2, "Frey": 1, "Martell": 1}}]}, {"q": "¿Qué cumplido te agradaría más?", "a": [{"t": "\"Es el más honesto de los hombres\"", "w": {"Stark": 3, "Tully": 1, "Mormont": 1}}, {"t": "\"Nunca se le escapa nada\"", "w": {"Lannister": 2, "Hightower": 2, "Bolton": 1, "Frey": 1}}, {"t": "\"Da gusto verlo combatir\"", "w": {"Baratheon": 2, "Clegane": 1, "Bracken": 1, "Mormont": 1}}, {"t": "\"Nadie tiene una sangre más noble\"", "w": {"Targaryen": 2, "Hightower": 1, "Tyrell": 1, "Velaryon": 1}}]}, {"q": "Una hambruna golpea tus tierras. ¿Lo primero que haces?", "a": [{"t": "Abro mis graneros y comparto lo que tengo", "w": {"Tully": 3, "Tyrell": 1, "Stark": 1}}, {"t": "Saqueo a mis vecinos más ricos", "w": {"Greyjoy": 3, "Bracken": 1}}, {"t": "Racionamiento estricto y orden férreo, sin excepciones", "w": {"Tarly": 2, "Bolton": 2, "Arryn": 1}}, {"t": "Compro grano en otra parte, a cualquier precio", "w": {"Lannister": 2, "Hightower": 1, "Velaryon": 1, "Frey": 1}}]}, {"q": "Tu hermano te traiciona por el poder. ¿Qué sientes sobre todo?", "a": [{"t": "Dolor: la sangre no debería hacer esto", "w": {"Stark": 2, "Tully": 2, "Velaryon": 1}}, {"t": "Una fría determinación de vencer de todos modos", "w": {"Lannister": 2, "Bolton": 2, "Targaryen": 1}}, {"t": "Rabia que exige venganza inmediata", "w": {"Baratheon": 2, "Umber": 1, "Clegane": 1, "Bracken": 1}}, {"t": "Nada: ya me lo esperaba", "w": {"Frey": 2, "Greyjoy": 2, "Hightower": 1, "Martell": 1}}]}, {"q": "¿Cómo te vistes para una ocasión importante?", "a": [{"t": "Sobrio y práctico, sin ostentación", "w": {"Stark": 2, "Mormont": 2, "Tarly": 1, "Umber": 1}}, {"t": "Espléndido: la apariencia es la mitad del poder", "w": {"Tyrell": 3, "Lannister": 1, "Targaryen": 1}}, {"t": "Con los colores y la armadura de mi casa, siempre", "w": {"Bracken": 1, "Blackwood": 1, "Baratheon": 2, "Velaryon": 1}}, {"t": "Con algo que intimide a quien me mire", "w": {"Bolton": 3, "Clegane": 1}}]}, {"q": "¿Qué es lo que más te asusta?", "a": [{"t": "Perder a mi gente", "w": {"Stark": 2, "Tully": 2, "Mormont": 1, "Velaryon": 1}}, {"t": "Caer en el olvido", "w": {"Targaryen": 2, "Lannister": 2, "Hightower": 1, "Blackfyre": 2}}, {"t": "Verme obligado a obedecer", "w": {"Greyjoy": 2, "Martell": 2, "Blackwood": 1, "Baratheon": 1}}, {"t": "Mostrar debilidad", "w": {"Bolton": 2, "Clegane": 2, "Tarly": 1, "Bracken": 1}}]}, {"q": "Un joven de tu casa te pide consejo sobre el matrimonio. ¿Qué le dices?", "a": [{"t": "Cásate con quien fortalezca nuestra posición", "w": {"Frey": 2, "Lannister": 2, "Hightower": 1, "Tyrell": 1}}, {"t": "Cásate con quien respetes y en quien confíes", "w": {"Stark": 2, "Tully": 2, "Mormont": 1}}, {"t": "Cásate con quien quieras: la vida ya es bastante dura", "w": {"Baratheon": 2, "Martell": 2, "Greyjoy": 1}}, {"t": "Cásate con cuidado: ciertas uniones sanan viejas heridas, otras las reabren", "w": {"Velaryon": 1, "Bracken": 1, "Blackwood": 1, "Arryn": 1, "Bolton": 1}}]}, {"q": "Preferirías ganar una guerra...", "a": [{"t": "con una sola batalla decisiva, cara a cara", "w": {"Baratheon": 2, "Umber": 2, "Clegane": 1, "Mormont": 1}}, {"t": "sin combatir en absoluto, mediante la diplomacia", "w": {"Tyrell": 2, "Hightower": 2, "Tully": 1, "Arryn": 1}}, {"t": "desgastando al enemigo hasta que se derrumbe solo", "w": {"Bolton": 2, "Stark": 1, "Frey": 1, "Tarly": 1}}, {"t": "golpeando donde no se lo espera", "w": {"Greyjoy": 2, "Bracken": 1, "Blackwood": 1, "Lannister": 1, "Martell": 1}}]}, {"q": "¿Qué te da más satisfacción?", "a": [{"t": "Ver un plan de años dando por fin sus frutos", "w": {"Lannister": 2, "Hightower": 2, "Frey": 1, "Bolton": 1}}, {"t": "Un trabajo bien hecho con mis propias manos", "w": {"Tarly": 1, "Mormont": 2, "Stark": 1, "Umber": 1}}, {"t": "El momento en que un adversario comprende que ha perdido", "w": {"Bolton": 2, "Targaryen": 2, "Bracken": 1, "Martell": 1}}, {"t": "Una fiesta plena, con mi gente feliz", "w": {"Tully": 2, "Tyrell": 2, "Baratheon": 1}}]}, {"q": "¿Qué animal elegirías como símbolo?", "a": [{"t": "Un depredador solitario del norte", "w": {"Stark": 3, "Mormont": 1}}, {"t": "Una criatura del mar", "w": {"Greyjoy": 2, "Velaryon": 3}}, {"t": "Un ave de rapiña", "w": {"Arryn": 3, "Blackwood": 1}}, {"t": "Una bestia que infunde terror", "w": {"Clegane": 1, "Bolton": 2, "Targaryen": 1, "Baratheon": 1, "Bracken": 1}}]}, {"q": "Te piden romper un juramento por un bien mayor. ¿Tú?", "a": [{"t": "No lo rompo: un juramento es lo único que queda cuando todo se derrumba", "w": {"Stark": 3, "Tarly": 1, "Mormont": 1}}, {"t": "Lo rompo, si el bien es realmente mayor", "w": {"Tyrell": 1, "Baratheon": 2, "Targaryen": 1, "Tully": 1}}, {"t": "Lo rompo sin muchos escrúpulos: los juramentos son herramientas", "w": {"Frey": 2, "Lannister": 1, "Greyjoy": 1, "Bolton": 1}}, {"t": "Depende a quién se lo juré", "w": {"Bracken": 2, "Blackwood": 2, "Martell": 1, "Hightower": 1, "Blackfyre": 1}}]}, {"q": "¿Cómo te comportas con los sirvientes y la gente común?", "a": [{"t": "Con justicia: ellos dependen de mí y yo de ellos", "w": {"Stark": 2, "Tully": 2, "Tarly": 1, "Arryn": 1}}, {"t": "Con cortesía calculada: el afecto del pueblo es poder", "w": {"Tyrell": 3, "Lannister": 1}}, {"t": "Están ahí para servir, nada más", "w": {"Bolton": 2, "Frey": 2, "Greyjoy": 1, "Clegane": 1}}, {"t": "Bebo y río con ellos como si fueran mis iguales", "w": {"Baratheon": 2, "Umber": 2, "Bracken": 1}}]}, {"q": "¿Cuál es tu forma de afrontar el dolor físico?", "a": [{"t": "Lo oculto: nadie debe verlo", "w": {"Bolton": 2, "Tarly": 1, "Stark": 1, "Hightower": 1}}, {"t": "Lo uso como combustible para mi ira", "w": {"Clegane": 3, "Umber": 1, "Baratheon": 1}}, {"t": "Lo soporto porque debo, sin quejarme", "w": {"Mormont": 2, "Stark": 1, "Martell": 1, "Tarly": 1}}, {"t": "Lo grito al mundo: ¿para qué fingir?", "w": {"Greyjoy": 1, "Bracken": 1, "Tully": 1, "Umber": 1}}]}, {"q": "¿Qué frase te representa mejor?", "a": [{"t": "\"Lo que está muerto no puede morir\"", "w": {"Greyjoy": 3}}, {"t": "\"Mis rencores duran tanto como mi nombre\"", "w": {"Bracken": 2, "Blackwood": 2, "Martell": 1}}, {"t": "\"Recuerdo todas mis deudas, y todos mis créditos\"", "w": {"Lannister": 2, "Frey": 2}}, {"t": "\"Resisto para que otros puedan vivir\"", "w": {"Stark": 2, "Tully": 1, "Velaryon": 1, "Mormont": 1}}]}, {"q": "Una nueva ruta comercial podría enriquecerte, pero es peligrosa. ¿Tú?", "a": [{"t": "La exploro yo mismo, primero", "w": {"Velaryon": 3, "Greyjoy": 1}}, {"t": "Invierto y envío a otros a arriesgarse", "w": {"Lannister": 2, "Hightower": 2, "Frey": 1}}, {"t": "No me interesa: mi riqueza es la tierra", "w": {"Stark": 2, "Arryn": 2, "Umber": 1, "Tarly": 1}}, {"t": "La tomo por la fuerza, si hace falta", "w": {"Bracken": 1, "Baratheon": 1, "Greyjoy": 2, "Bolton": 1}}]}, {"q": "¿Qué piensas de quien nace sin nombre ni título?", "a": [{"t": "Cuenta lo que hace, no de dónde viene", "w": {"Baratheon": 1, "Mormont": 2, "Stark": 1, "Tully": 1}}, {"t": "Puede ascender, si es lo bastante útil y hábil", "w": {"Lannister": 1, "Tyrell": 2, "Frey": 1, "Hightower": 1}}, {"t": "La sangre importa, y no se puede fingir", "w": {"Targaryen": 2, "Hightower": 1, "Velaryon": 1, "Arryn": 1, "Frey": 1, "Blackfyre": 2}}, {"t": "Me es indiferente mientras no se cruce en mi camino", "w": {"Bolton": 2, "Greyjoy": 1, "Clegane": 1, "Bracken": 1}}]}, {"q": "Has sido derrotado públicamente. ¿Tu primer movimiento?", "a": [{"t": "Me retiro, me reorganizo, y vuelvo más fuerte", "w": {"Stark": 1, "Tarly": 2, "Bolton": 2, "Hightower": 1}}, {"t": "Busco de inmediato una revancha", "w": {"Baratheon": 2, "Umber": 2, "Clegane": 1, "Bracken": 1}}, {"t": "Forjo nuevas alianzas para darle la vuelta a todo", "w": {"Frey": 2, "Tyrell": 2, "Lannister": 1, "Martell": 1}}, {"t": "No reconozco la derrota: no estoy roto", "w": {"Martell": 3, "Greyjoy": 1, "Targaryen": 1, "Blackfyre": 2}}]}, {"q": "¿Qué regalo le ofrecerías a un rey?", "a": [{"t": "Mi espada y mi juramento", "w": {"Stark": 2, "Tarly": 1, "Mormont": 1, "Baratheon": 1}}, {"t": "Un tesoro que nadie más podría permitirse", "w": {"Lannister": 3, "Hightower": 1}}, {"t": "Una nave construida especialmente para él", "w": {"Velaryon": 3, "Greyjoy": 1}}, {"t": "Un consejo que vale más que mil tesoros", "w": {"Tyrell": 2, "Hightower": 2, "Frey": 1, "Bolton": 1}}]}, {"q": "¿Cómo reaccionas ante el éxito de un rival?", "a": [{"t": "Lo reconozco abiertamente, aunque me pese", "w": {"Stark": 2, "Baratheon": 1, "Tully": 1, "Mormont": 1}}, {"t": "Lo estudio para descubrir cómo superarlo", "w": {"Lannister": 2, "Tarly": 2, "Hightower": 1}}, {"t": "Lo mino en silencio, desde dentro", "w": {"Bolton": 2, "Frey": 2, "Tyrell": 1}}, {"t": "Me enciende y me impulsa a hacer más, de inmediato", "w": {"Targaryen": 2, "Bracken": 2, "Baratheon": 1, "Umber": 1, "Blackfyre": 1}}]}, {"q": "¿Cuál es tu idea de una buena muerte?", "a": [{"t": "En batalla, con el arma en la mano", "w": {"Umber": 2, "Clegane": 2, "Baratheon": 1, "Mormont": 1, "Greyjoy": 1}}, {"t": "Ahogado en el mar que me dio todo", "w": {"Greyjoy": 2, "Velaryon": 2}}, {"t": "Viejo, rodeado de los míos, tras haber cumplido mi deber", "w": {"Stark": 2, "Tully": 2, "Arryn": 1, "Tarly": 1}}, {"t": "Tal que mi nombre nunca sea olvidado", "w": {"Targaryen": 2, "Lannister": 2, "Hightower": 1, "Martell": 1}}]}, {"q": "Te confían un secreto peligroso. ¿Qué haces con él?", "a": [{"t": "Lo guardo: la confianza es sagrada", "w": {"Stark": 2, "Tully": 2, "Mormont": 1, "Velaryon": 1}}, {"t": "Lo conservo como una moneda para gastar en el momento oportuno", "w": {"Lannister": 2, "Frey": 2, "Hightower": 1, "Bolton": 1}}, {"t": "Lo verifico y lo sumo a lo que ya sé", "w": {"Hightower": 2, "Tyrell": 1, "Bolton": 1, "Arryn": 1}}, {"t": "Decido según quién me lo dio y qué gano con ello", "w": {"Bracken": 1, "Martell": 1, "Targaryen": 1, "Greyjoy": 1, "Frey": 1}}]}, {"q": "¿Qué es lo que más aprecias en una fiesta?", "a": [{"t": "El vino y la música hasta el amanecer", "w": {"Baratheon": 2, "Tully": 1, "Umber": 2, "Bracken": 1}}, {"t": "La elegancia y las conversaciones refinadas", "w": {"Tyrell": 3, "Hightower": 1, "Lannister": 1}}, {"t": "Ver quién habla con quién, y por qué", "w": {"Lannister": 2, "Frey": 2, "Bolton": 1, "Martell": 1}}, {"t": "Preferiría no estar allí en absoluto", "w": {"Stark": 2, "Arryn": 2, "Tarly": 1, "Mormont": 1}}]}, {"q": "Un comandante debe elegir: salvar a unos pocos suyos o golpear a muchos enemigos. ¿Tú?", "a": [{"t": "Salvo a los míos: cada vida bajo mi mando cuenta", "w": {"Stark": 2, "Tully": 2, "Mormont": 2, "Velaryon": 1}}, {"t": "Golpeo: la victoria salva más vidas a largo plazo", "w": {"Tarly": 2, "Bolton": 2, "Targaryen": 1, "Lannister": 1}}, {"t": "Golpeo y punto: la guerra es la guerra", "w": {"Clegane": 2, "Greyjoy": 1, "Bracken": 1, "Umber": 1}}, {"t": "Busco una tercera vía que nadie ha visto", "w": {"Tyrell": 2, "Hightower": 2, "Frey": 1}}]}, {"q": "¿Qué piensas de las profecías y los presagios?", "a": [{"t": "Han guiado a mi linaje durante siglos", "w": {"Targaryen": 3, "Hightower": 1}}, {"t": "Supersticiones: lo que cuenta es lo que yo hago", "w": {"Bolton": 1, "Lannister": 1, "Tarly": 2, "Baratheon": 1}}, {"t": "Los Antiguos Dioses hablan, si sabes escucharlos", "w": {"Stark": 2, "Blackwood": 2, "Mormont": 1}}, {"t": "Los estudio: hasta una superstición mueve a los hombres", "w": {"Hightower": 2, "Tyrell": 1, "Frey": 1, "Martell": 1}}]}, {"q": "Debes nombrar a tu sucesor entre dos hijos igualmente capaces. ¿Cómo eliges?", "a": [{"t": "El primogénito: el orden lo es todo", "w": {"Frey": 2, "Arryn": 2, "Tarly": 1, "Hightower": 1}}, {"t": "El más apto para gobernar, sea primogénito o no", "w": {"Tyrell": 2, "Martell": 2, "Velaryon": 1, "Lannister": 1}}, {"t": "Dejo que lo demuestren mediante una prueba", "w": {"Bolton": 2, "Greyjoy": 2, "Baratheon": 1, "Umber": 1}}, {"t": "Aquel que más ame nuestra gente", "w": {"Stark": 2, "Tully": 2, "Mormont": 1}}]}, {"q": "¿Cuál es tu actitud hacia el cambio?", "a": [{"t": "Lo acojo si nos hace más fuertes", "w": {"Targaryen": 2, "Velaryon": 2, "Tyrell": 1, "Lannister": 1}}, {"t": "Desconfío: lo que perdura ya ha demostrado su valor", "w": {"Stark": 2, "Arryn": 2, "Frey": 1, "Tarly": 1}}, {"t": "Lo aprovecho a mi favor", "w": {"Lannister": 2, "Frey": 1, "Hightower": 1, "Bolton": 1}}, {"t": "Lo enfrento como enfrento todo: de frente", "w": {"Baratheon": 2, "Umber": 2, "Bracken": 1, "Greyjoy": 1}}]}, {"q": "¿Cómo te sientes cuando estás lejos de casa por mucho tiempo?", "a": [{"t": "Inquieto: una parte de mí siempre se queda allí", "w": {"Stark": 3, "Tully": 1, "Arryn": 1, "Mormont": 1}}, {"t": "A gusto: el hogar es donde yo esté", "w": {"Greyjoy": 2, "Velaryon": 2, "Targaryen": 1}}, {"t": "Concentrado en el objetivo que me alejó", "w": {"Tarly": 2, "Bolton": 1, "Lannister": 1, "Hightower": 1}}, {"t": "Listo para volver y saldar las cuentas pendientes", "w": {"Bracken": 2, "Blackwood": 2, "Umber": 1}}]}, {"q": "Un enemigo te ofrece una alianza ventajosa. ¿Tú?", "a": [{"t": "La rechazo: ciertas enemistades no se venden", "w": {"Bracken": 2, "Blackwood": 2, "Martell": 1, "Umber": 1}}, {"t": "La acepto, dejando el orgullo de lado por el bien común", "w": {"Tully": 2, "Tyrell": 2, "Velaryon": 1, "Stark": 1}}, {"t": "La acepto, dispuesto a traicionarlo primero", "w": {"Frey": 2, "Bolton": 1, "Greyjoy": 1, "Lannister": 1}}, {"t": "La sopeso con frialdad, sin sentimientos", "w": {"Hightower": 2, "Lannister": 1, "Tarly": 1, "Targaryen": 1}}]}, {"q": "¿Qué admiras más en un gran comandante del pasado?", "a": [{"t": "Su disciplina y organización", "w": {"Tarly": 3, "Bolton": 1, "Hightower": 1}}, {"t": "Su valor personal en primera línea", "w": {"Baratheon": 2, "Umber": 2, "Mormont": 1, "Clegane": 1}}, {"t": "Su astucia y sus engaños", "w": {"Lannister": 2, "Frey": 1, "Tyrell": 1, "Martell": 1}}, {"t": "Su capacidad de inspirar devoción", "w": {"Stark": 2, "Tully": 1, "Targaryen": 1, "Velaryon": 1}}]}, {"q": "Tienes un día entero de poder absoluto sobre el reino. ¿Lo primero que haces?", "a": [{"t": "Reformo las leyes para que sean justas para todos", "w": {"Stark": 1, "Tully": 2, "Arryn": 2, "Tarly": 1}}, {"t": "Consolido a mi familia en los puestos que importan", "w": {"Lannister": 2, "Frey": 2, "Hightower": 1}}, {"t": "Emprendo una gran empresa que me convierta en leyenda", "w": {"Targaryen": 3, "Velaryon": 1}}, {"t": "Aplasto a mis viejos enemigos de una vez por todas", "w": {"Bracken": 2, "Bolton": 2, "Greyjoy": 1, "Clegane": 1, "Blackfyre": 1}}]}, {"q": "¿Cómo te relacionas con quienes te adulan?", "a": [{"t": "Desconfío: los aduladores siempre esconden algo", "w": {"Stark": 2, "Bolton": 2, "Tarly": 1, "Arryn": 1}}, {"t": "Lo agradezco, pero no me fío", "w": {"Lannister": 2, "Hightower": 1, "Tyrell": 1, "Martell": 1}}, {"t": "Me molesta: decidme las cosas como son", "w": {"Baratheon": 2, "Umber": 2, "Mormont": 1, "Greyjoy": 1}}, {"t": "Lo aprovecho: quien adula es fácil de manipular", "w": {"Frey": 2, "Tyrell": 1, "Bolton": 1, "Bracken": 1}}]}, {"q": "¿Qué precio jamás pagarías, por ningún trono?", "a": [{"t": "Mi palabra y mi honor", "w": {"Stark": 3, "Mormont": 1, "Tarly": 1}}, {"t": "La seguridad de los míos", "w": {"Tully": 3, "Velaryon": 1, "Mormont": 1}}, {"t": "Mi libertad de no arrodillarme jamás", "w": {"Greyjoy": 2, "Martell": 2, "Blackwood": 1, "Baratheon": 1}}, {"t": "Ninguno: por el trono adecuado pagaría cualquier precio", "w": {"Targaryen": 2, "Lannister": 2, "Frey": 1, "Bolton": 1, "Blackfyre": 2}}]}, {"q": "Un viejo rival de tu familia te supera en todo. ¿Qué es lo que más te quema?", "a": [{"t": "Que sean precisamente ellos quienes se impongan", "w": {"Bracken": 3, "Blackwood": 3}}, {"t": "Que mi nombre se deslice hacia la sombra", "w": {"Lannister": 1, "Targaryen": 1, "Hightower": 2, "Tyrell": 1, "Blackfyre": 2}}, {"t": "Nada: envidiar es perder el tiempo", "w": {"Stark": 1, "Mormont": 2, "Arryn": 1, "Velaryon": 1}}, {"t": "No poder enfrentarlos abiertamente", "w": {"Umber": 2, "Baratheon": 2, "Greyjoy": 1, "Clegane": 1}}]}, {"q": "¿Cómo tomas las decisiones difíciles?", "a": [{"t": "Solo, en silencio, tras una larga reflexión", "w": {"Stark": 2, "Bolton": 2, "Arryn": 1, "Hightower": 1}}, {"t": "Consultando a quienes más confío", "w": {"Tully": 2, "Velaryon": 2, "Tarly": 1, "Mormont": 1}}, {"t": "Por instinto: normalmente tengo razón", "w": {"Baratheon": 2, "Bracken": 2, "Umber": 1, "Greyjoy": 1}}, {"t": "Sopesando cada ventaja posible", "w": {"Lannister": 2, "Frey": 2, "Tyrell": 1, "Targaryen": 1}}]}, {"q": "¿Qué recuerdo de infancia te resulta más familiar?", "a": [{"t": "Aprender a empuñar un arma antes de saber leer", "w": {"Umber": 2, "Mormont": 2, "Clegane": 1, "Bracken": 1, "Greyjoy": 1}}, {"t": "Horas pasadas entre libros y maestros", "w": {"Hightower": 3, "Lannister": 1, "Tyrell": 1}}, {"t": "Que me dijeran cuán antiguo y grande era mi nombre", "w": {"Targaryen": 2, "Hightower": 1, "Frey": 1, "Velaryon": 1, "Martell": 1, "Blackfyre": 2}}, {"t": "Jugar libre entre bosques y patios", "w": {"Stark": 2, "Tully": 2, "Baratheon": 1}}]}, {"q": "¿Qué harías si descubrieras que toda tu fortuna se basa en una vieja mentira?", "a": [{"t": "La revelaría: vivir en la verdad importa más que la fortuna", "w": {"Stark": 2, "Tarly": 1, "Tully": 1, "Mormont": 1}}, {"t": "La enterraría aún más hondo", "w": {"Lannister": 2, "Frey": 2, "Hightower": 1, "Bolton": 1}}, {"t": "La convertiría en una leyenda todavía más grande", "w": {"Targaryen": 2, "Tyrell": 2, "Velaryon": 1, "Blackfyre": 1}}, {"t": "Nada cambiaría: el poder es poder", "w": {"Bolton": 1, "Greyjoy": 2, "Bracken": 1, "Clegane": 1}}]}, {"q": "El invierno se acerca y durará años. ¿Cómo te preparas?", "a": [{"t": "Lleno los graneros y organizo cada recurso con método", "w": {"Stark": 3, "Tarly": 1, "Tully": 1}}, {"t": "Compro todo lo necesario, en todas partes, a cualquier precio", "w": {"Lannister": 2, "Hightower": 2, "Frey": 1, "Velaryon": 1}}, {"t": "Tomaré lo que haga falta de quienes no se prepararon", "w": {"Greyjoy": 3, "Bracken": 1, "Bolton": 1}}, {"t": "El invierno no me asusta: mi gente es dura", "w": {"Umber": 2, "Mormont": 2, "Stark": 1}}]}, {"q": "¿Cuál te suena más a cumplido y cuál a ofensa? Elige lo que más te defina:", "a": [{"t": "\"Eres predecible\" — y está bien así, porque soy de fiar", "w": {"Stark": 2, "Tully": 1, "Tarly": 2, "Mormont": 1}}, {"t": "\"Eres despiadado\" — y lo tomo como un hecho, no como una acusación", "w": {"Bolton": 3, "Clegane": 1, "Greyjoy": 1}}, {"t": "\"Eres impredecible\" — exactamente lo que quiero ser", "w": {"Lannister": 1, "Tyrell": 2, "Martell": 1, "Bracken": 1, "Targaryen": 1}}, {"t": "\"Eres testarudo\" — llámalo como quieras, yo no me rindo", "w": {"Umber": 2, "Blackwood": 1, "Bracken": 1, "Baratheon": 1, "Martell": 1}}]}, {"q": "Por último: ¿qué querrías que sintiera la gente al pronunciar tu nombre?", "a": [{"t": "Respeto y confianza", "w": {"Stark": 2, "Tully": 2, "Arryn": 1, "Mormont": 1, "Velaryon": 1}}, {"t": "Sobrecogimiento ante la grandeza", "w": {"Targaryen": 2, "Hightower": 2, "Lannister": 1, "Tyrell": 1, "Blackfyre": 1}}, {"t": "Un escalofrío de miedo", "w": {"Bolton": 2, "Clegane": 2, "Greyjoy": 1, "Bracken": 1}}, {"t": "La calidez de saber que allí estaré", "w": {"Tully": 1, "Baratheon": 2, "Umber": 2, "Mormont": 1}}]}, {"q": "Un halcón se posa en tu brazo durante un consejo tenso. ¿Qué haces?", "a": [{"t": "Lo dejo estar y sigo adelante: la calma vale más que cualquier gesto", "w": {"Arryn": 3, "Hightower": 1, "Stark": 1}}, {"t": "Lo acaricio y lo uso para romper la tensión a mi favor", "w": {"Tyrell": 2, "Lannister": 1, "Martell": 1, "Arryn": 1}}, {"t": "Lo espanto: no hay tiempo para tales distracciones", "w": {"Tarly": 2, "Bolton": 1, "Baratheon": 1, "Clegane": 1}}, {"t": "Pienso que es un presagio e intento interpretarlo", "w": {"Blackwood": 3, "Targaryen": 1, "Arryn": 1}}]}, {"q": "Te piden vigilar una frontera remota olvidada durante años. ¿Tú?", "a": [{"t": "Acepto con orgullo: las fronteras se defienden de todos modos", "w": {"Mormont": 2, "Umber": 2, "Arryn": 2, "Stark": 1}}, {"t": "Intento cambiarlo por un cargo como el fuego: quieres un nombre que el tiempo no pueda borrar. Las profecías y las grandes hazañas te llaman, y lo que de verdad deseas, lo tomas."}, "Arryn": {"motto": "Tan alto como el honor", "sigil": "Un halcón blanco y una luna en campo azul cielo", "blurb": "Señor del Nido de Águilas, el inexpugnable castillo entre las nubes. Cauto, paciente, celoso de tu seguridad: no abres puertas cerradas sin un buen motivo y no corres riesgos innecesarios. Para ti el honor es una altitud: algo hacia lo que se aspira, no un gesto ostentoso."}, "Tyrell": {"motto": "Crecer Fuerte", "sigil": "Una rosa dorada en campo verde hierba", "blurb": "Ascendidos del cargo de senescales al trono de Altojardín gracias a la cortesía y la habilidad. Sabes que el afecto del pueblo es poder y que una sonrisa desarma más que una espada. Cultivas alianzas como quien cultiva un jardín: con paciencia, elegancia y un ojo siempre atento a lo que florecerá."}, "Martell": {"motto": "Nunca doblegados, nunca inclinados, nunca rotos", "sigil": "Un sol rojo atravesado por una lanza", "blurb": "Príncipes de Dorne, indómitos bajo su sol feroz. Ningún dragón os dobló jamás. Orgulloso e independiente, no olvidas un agravio y sirves tu venganza fría, cuando el momento es perfecto. Marcas tus propias reglas, y jamás te arrodillas ante quien no lo merece."}, "Baratheon": {"motto": "Nuestra es la furia", "sigil": "Un ciervo coronado negro en campo de oro", "blurb": "Fuerte como la tormenta que azota Bastión de Tormentas. Enfrentas todo de frente: la batalla, el insulto, la vida misma. Valiente, franco, incapaz de fingir: prefieres una sola batalla decisiva cara a cara antes que mil intrigas. Bebes, ríes y luchas con todo el corazón."}, "Tully": {"motto": "Familia, deber, honor", "sigil": "Una trucha plateada en campo azul y rojo", "blurb": "Señores de Aguasdulces, donde los ríos se encuentran. Para ti, las personas van primero: abres los graneros en la hambruna, guardas los secretos, pones fin a las disputas. La familia no es solo sangre, sino todos los que dependen de ti, y nunca los decepcionas."}, "Greyjoy": {"motto": "Nosotros no sembramos", "sigil": "Un kraken dorado en campo negro", "blurb": "Hombres de hierro de las islas, orgullosos de su libertad feroz. No siembras: tomas lo que necesitas del mar y de quienes son demasiado débiles para conservarlo. El hogar es la cubierta de tu nave, y lo que está muerto no puede morir. Ningún amo, ninguna cadena."}, "Hightower": {"motto": "Nosotros iluminamos el camino", "sigil": "Una torre de piedra coronada de llamas en campo gris", "blurb": "La casa más antigua y rica de Antigua, guardiana de la Ciudadela y del saber. Prudente y devoto, abres las puertas cuando la fuerza es inútil y sostienes tus libros como otros sostienen espadas. Sabes que el conocimiento paciente sobrevive a todo conquistador."}, "Velaryon": {"motto": "Lo antiguo, lo verdadero, lo valiente", "sigil": "Un hipocampo plateado en campo azul marino", "blurb": "Sangre valyria antigua, ligada al mar más que a la tierra. Eres el primero en explorar rutas peligrosas, construyendo flotas que llevan tu nombre más allá del horizonte. Leal y valiente, tu hogar está allí donde te lleve la marea, y tu riqueza viene de las olas."}, "Bolton": {"motto": "Nuestras hojas están afiladas", "sigil": "Un hombre desollado en campo rosa sangre", "blurb": "Antiguos señores de Fuerte Terror, con una reputación tan temida como antigua. Frío, paciente, calculador: un hombre desnudo tiene pocos secretos, dices, y algo sabes de eso. Nunca muestras debilidad, no concedes piedad gratuita, y dejas que tu nombre haga el trabajo del miedo."}, "Tarly": {"motto": "Primeros en la batalla", "sigil": "Un cazador a grandes zancadas en campo verde y plata", "blurb": "Señores de Colina Cuerno, famosos por su disciplina marcial. Para ti, el orden, el adiestramiento y la estrategia ganan las guerras. Severo contigo mismo antes que con los demás, templas a tus herederos con pruebas duras y diriges la maniobra mientras otros buscan la gloria de la primera línea."}, "Mormont": {"motto": "Aquí nos mantenemos", "sigil": "Un oso negro en campo verde", "blurb": "De la ruda Isla del Oso, donde hasta las mujeres empuñan la espada sin que nadie lo discuta. Directo, leal, incansable: para ti cuenta lo que uno hace, no de dónde viene. Soportas el dolor sin quejarte, defiendes fronteras olvidadas, y mantienes tu puesto pase lo que pase."}, "Clegane": {"motto": "(sin lema noble — solo tres perros negros en campo amarillo)", "sigil": "Tres perros negros en campo amarillo", "blurb": "Una casa joven y violenta, criada para servir mediante la fuerza bruta. Respondes al insulto a puñetazos, derribas puertas en vez de rodearlas, y usas el dolor como combustible para tu ira. Directo hasta la brutalidad, desprecias las sutilezas y la falsa cortesía de la corte."}, "Bracken": {"motto": "Nadie sabe cuál (la rivalidad es eterna)", "sigil": "Un caballo rojo y un sol dorado en campo marrón", "blurb": "Señores de las Tierras de los Ríos, unidos por una enemistad antigua e inextinguible con los Blackwood. Impulsivo, orgulloso, incapaz de dejar pasar un agravio: ciertos rencores duran tanto como tu nombre. Enfrentas a tus enemigos abiertamente, y lo que más te quema es verlos precisamente a ellos salir victoriosos."}, "Blackwood": {"motto": "(guardianes de los antiguos dioses y del árbol corazón)", "sigil": "Una bandada de cuervos y un árbol corazón en campo rojo", "blurb": "Antiguos señores de las Tierras de los Ríos, fieles a los antiguos dioses y enemigos jurados de los Bracken. Lees los presagios, escuchas el silencio de los árboles y nunca olvidas una ofensa. Golpeas donde no te esperan y llevas tus rencores con el mismo cuidado con que guardas las viejas tradiciones."}, "Umber": {"motto": "(la fuerza bruta del Gran Jon)", "sigil": "Un gigante rompiendo cadenas en campo plateado", "blurb": "Vasallos de los Stark del extremo Norte, enormes, ruidosos y feroces. Terco e impulsivo, dices las cosas como son y afrontas la vida de frente. Aprendes a empuñar un arma antes incluso de saber leer, y tu lealtad, una vez entregada, es tan inquebrantable como el hielo."}, "Frey": {"motto": "(sin lema antiguo — ascendieron con el Cruce)", "sigil": "Dos torres unidas por un puente en campo de plata y azul", "blurb": "Señores del Cruce, dueños de los Gemelos y de todos los que quieren atravesar el río. Oportunista y tenaz, llevas la cuenta exacta de cada favor y cada desaire. Sabes que no tienes la sangre más antigua, y precisamente por eso nunca dejas escapar una ocasión de ascender."}, "Blackfyre": {"motto": "(el dragón negro — los colores Targaryen invertidos)", "sigil": "Un dragón negro tricéfalo en campo rojo", "blurb": "Sangre de dragón, pero nacida del lado equivocado de la sucesión: desciendes de Daemon Blackfyre, el bastardo legitimado que empuñó la espada del Conquistador y reclamó un trono que consideraba suyo por derecho. Orgulloso e implacable, cargas con el peso de una exclusión que arde desde hace generaciones. Cuatro rebeliones fallidas no han apagado tu convicción: el exilio más allá del Mar Angosto, la Compañía Dorada a tu lado, y un rencor que no conoce la rendición. Lo que te fue negado, volverás a reclamarlo."}}}};

let LANG = "it";
let QUIZ, HOUSES, ORDER, MAXPOSS;
const ROMAN=(n)=>{const m=[[1000,"M"],[900,"CM"],[500,"D"],[400,"CD"],[100,"C"],[90,"XC"],[50,"L"],[40,"XL"],[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]];let r="";for(const[v,s]of m){while(n>=v){r+=s;n-=v;}}return r;};

let idx=0;
let answers=[];
let score={};

const $=id=>document.getElementById(id);

function show(sec){ for(const s of ["intro","quiz","result"]) $(s).classList.toggle("hidden", s!==sec); window.scrollTo({top:0,behavior:"instant"}); }

function setLanguage(lang){
  LANG = lang;
  const d = DATA_ALL[lang];
  QUIZ = d.quiz;
  HOUSES = d.houses;
  ORDER = Object.keys(HOUSES);
  MAXPOSS = {};
  for(const h of ORDER) MAXPOSS[h]=0;
  for(const q of QUIZ){
    const best={};
    for(const a of q.a){ for(const [h,w] of Object.entries(a.w)){ best[h]=Math.max(best[h]||0, w); } }
    for(const [h,w] of Object.entries(best)) MAXPOSS[h]+=w;
  }
  answers = new Array(QUIZ.length).fill(null);
  score = {}; for(const h of ORDER) score[h]=0;

  const t = UI[lang];
  document.documentElement.lang = lang;
  document.title = t.title;
  $("txtPresents").textContent = t.presents;
  $("txtEyebrow").textContent = t.eyebrow;
  $("txtH1").textContent = t.h1;
  $("txtSub").textContent = t.sub;
  $("txtIntroP1").textContent = t.introP1;
  $("txtIntroP2").textContent = t.introP2;
  $("startBtn").textContent = t.startBtn;
  $("txtIntroFooter").textContent = t.introFooter;
  $("txtVerdict").textContent = t.verdict;
  $("txtYourHouseIs").textContent = t.yourHouseIs;
  $("txtBreakdownTitle").textContent = t.breakdownTitle;
  $("againBtn").textContent = t.againBtn;
  $("txtResultFooter").textContent = t.resultFooter;

  document.querySelectorAll("#langRow [data-lang]").forEach(btn=>{
    btn.classList.toggle("active", btn.getAttribute("data-lang")===lang);
  });

  idx = 0;
  show("intro");
}

function recompute(){
  for(const h of ORDER) score[h]=0;
  for(let i=0;i<QUIZ.length;i++){
    const a=answers[i]; if(a===null) continue;
    const w=QUIZ[i].a[a].w;
    for(const [h,val] of Object.entries(w)) score[h]+=val;
  }
}

function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function renderQ(){
  const t = UI[LANG];
  const q=QUIZ[idx];
  $("qNum").textContent=t.questionWord+" "+ROMAN(idx+1);
  $("qCur").textContent=idx+1;
  $("qMeta").innerHTML = t.questionWord+" <b id=\"qCur\">"+(idx+1)+"<\/b> "+t.ofWord+" "+QUIZ.length;
  $("qPct").textContent=Math.max(1,Math.round((idx+1)/QUIZ.length*100))+"%";
  $("qBar").style.width=((idx)/QUIZ.length*100)+"%";
  $("qText").textContent=q.q;
  const letters=["A","B","C","D","E","F"];
  const box=$("qOpts"); box.innerHTML="";
  q.a.forEach((opt,i)=>{
    const b=document.createElement("button");
    b.className="opt"; b.type="button";
    b.innerHTML='<span class="marker">'+letters[i]+'</span>'+escapeHtml(opt.t);
    if(answers[idx]===i){ b.style.borderColor="var(--gold)"; b.style.background="rgba(200,162,74,.10)"; }
    b.onclick=()=>choose(i);
    box.appendChild(b);
  });
  $("backBtn").innerHTML = "&larr; " + t.back;
  $("backBtn").disabled = idx===0;
  $("hint").textContent = idx===QUIZ.length-1 ? t.hintLast : t.hintChoose;
  const card=$("qCard"); card.classList.remove("fade"); void card.offsetWidth; card.classList.add("fade");
}

function choose(i){
  answers[idx]=i;
  if(idx<QUIZ.length-1){ idx++; renderQ(); }
  else{ finish(); }
}

$("backBtn").onclick=()=>{ if(idx>0){ idx--; renderQ(); } };

function finish(){
  recompute();
  const t = UI[LANG];
  const norm=ORDER.map(h=>({h, v: MAXPOSS[h] ? score[h]/MAXPOSS[h] : 0, raw:score[h]}));
  norm.sort((a,b)=> b.v-a.v || b.raw-a.raw);
  const winner=norm[0].h;
  const info=HOUSES[winner];
  $("rHouse").textContent=t.houseWord+" "+winner;
  $("rMotto").textContent="\u201C"+info.motto+"\u201D";
  $("rSigil").textContent=info.sigil;
  $("rBlurb").textContent=info.blurb;

  const top=norm.slice(0,3);
  const maxv=top[0].v||1;
  const rows=$("rRows"); rows.innerHTML="";
  top.forEach((tt,i)=>{
    const pct=Math.round(tt.v/maxv*100);
    const div=document.createElement("div");
    div.className="row"+(i===0?" top":"");
    div.innerHTML='<div class="name">'+escapeHtml(tt.h)+'</div>'+
                  '<div class="track"><i style="width:0%"></i></div>'+
                  '<div class="pct">'+pct+'%</div>';
    rows.appendChild(div);
    requestAnimationFrame(()=>{ setTimeout(()=>{ div.querySelector("i").style.width=pct+"%"; }, 80+i*120); });
  });
  show("result");
}

document.querySelectorAll("#langRow [data-lang]").forEach(btn=>{
  btn.onclick = ()=> setLanguage(btn.getAttribute("data-lang"));
});

$("startBtn").onclick=()=>{ idx=0; renderQ(); show("quiz"); };
$("againBtn").onclick=()=>{ answers.fill(null); idx=0; show("intro"); };

setLanguage("it");
</script>
</body>
</html>
