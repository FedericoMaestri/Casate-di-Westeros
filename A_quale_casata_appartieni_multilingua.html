<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scopri la tua Casata di Westeros</title>
<style>
  :root{
    --ink:#eaf3fb; --ink-dim:#8ba3b8; --gold:#7fb8cf; --gold-bright:#bfe3f0;
    --blood:#1c3f91; --steel:#233a52; --steel-2:#15243a;
    --parch:#050b14; --panel:#0f1f33; --panel-2:#132a42;
    --line:rgba(191,227,240,.28);
    --shadow:0 18px 50px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 700px at 50% -10%, #163a63 0%, transparent 60%),
      radial-gradient(900px 600px at 100% 110%, #0d2a4a 0%, transparent 55%),
      linear-gradient(180deg,#050b14 0%, #03060a 100%);
    color:var(--ink);
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    min-height:100vh; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;padding:32px 20px 80px}
  .brand-logo{display:block;max-width:280px;width:70%;margin:0 auto 22px;opacity:.96}
  .wrap{padding-bottom:96px}

  .contact-bar{
    position:fixed;left:0;right:0;bottom:0;z-index:10;
    display:flex;justify-content:center;gap:28px;flex-wrap:wrap;
    padding:12px 16px;
    background:rgba(5,11,20,.86);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    border-top:1px solid var(--line);
  }
  .contact-bar a{
    display:inline-flex;align-items:center;gap:7px;
    color:var(--ink-dim);text-decoration:none;
    font-family:"Trebuchet MS",system-ui,sans-serif;font-size:12px;
    letter-spacing:.05em;text-transform:uppercase;
    transition:color .15s ease;
  }
  .contact-bar a:hover{color:var(--gold-bright)}
  .contact-bar a:focus-visible{outline:2px solid var(--gold-bright);outline-offset:3px;border-radius:6px}
  .contact-icon{width:18px;height:18px;flex:none}
  .presents{
    font-family:"Trebuchet MS",system-ui,sans-serif;
    letter-spacing:.32em;text-transform:uppercase;font-size:11px;
    color:var(--ink-dim);font-weight:600;margin:0 0 6px;text-align:center;
  }
  .eyebrow{
    font-family:"Trebuchet MS",system-ui,sans-serif;
    letter-spacing:.42em;text-transform:uppercase;font-size:11px;
    color:var(--gold);font-weight:600;margin:0 0 14px;text-align:center;
  }
  h1{
    text-align:center;font-weight:600;line-height:1.05;margin:0 0 8px;
    font-size:clamp(30px,7vw,52px);letter-spacing:.01em;
    background:linear-gradient(180deg,#eaf6ff,#7fb8cf 130%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sub{text-align:center;color:var(--ink-dim);font-size:16px;max-width:54ch;margin:0 auto 30px;font-style:italic}

  .crest{width:64px;height:64px;margin:0 auto 18px;display:block;opacity:.92}

  .lang-row{display:flex;justify-content:center;gap:8px;margin:0 0 18px;flex-wrap:wrap}
  .lang-pill{
    font-family:"Trebuchet MS",system-ui,sans-serif;font-weight:600;font-size:12px;
    letter-spacing:.08em;color:var(--ink-dim);background:transparent;
    border:1px solid var(--line);border-radius:99px;padding:6px 14px;cursor:pointer;
    transition:border-color .15s ease, color .15s ease, background .15s ease;
  }
  .lang-pill:hover{color:var(--gold-bright);border-color:var(--gold)}
  .lang-pill.active{color:#071120;background:linear-gradient(180deg,var(--gold-bright),var(--gold));border-color:transparent}
  .lang-pill:focus-visible{outline:2px solid var(--gold-bright);outline-offset:2px}

  /* intro card */
  .card{
    background:linear-gradient(180deg,var(--panel),var(--panel-2));
    border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);padding:26px 24px;
  }
  .intro p{margin:0 0 14px;color:#cfe0ee}
  .intro .note{font-size:14px;color:var(--ink-dim);font-style:italic}

  .btn{
    display:inline-flex;align-items:center;gap:10px;cursor:pointer;
    font-family:"Trebuchet MS",system-ui,sans-serif;font-weight:600;
    letter-spacing:.12em;text-transform:uppercase;font-size:13px;
    color:#071120;background:linear-gradient(180deg,var(--gold-bright),var(--gold));
    border:none;border-radius:10px;padding:14px 26px;
    transition:transform .12s ease, box-shadow .2s ease, filter .2s;
    box-shadow:0 6px 22px rgba(127,184,207,.28);
  }
  .btn:hover{transform:translateY(-1px);filter:brightness(1.05)}
  .btn:active{transform:translateY(0)}
  .btn:focus-visible{outline:2px solid var(--gold-bright);outline-offset:3px}
  .btn.ghost{
    background:transparent;color:var(--gold);border:1px solid var(--line);
    box-shadow:none;
  }
  .center{text-align:center;margin-top:22px}

  /* progress */
  .progress-wrap{margin:0 0 22px}
  .progress-meta{
    display:flex;justify-content:space-between;align-items:baseline;
    font-family:"Trebuchet MS",system-ui,sans-serif;font-size:12px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:8px;
  }
  .progress-meta b{color:var(--gold);font-weight:700}
  .bar{height:4px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden}
  .bar > i{
    display:block;height:100%;width:0%;border-radius:99px;
    background:linear-gradient(90deg,var(--blood),var(--gold));
    transition:width .35s cubic-bezier(.22,.61,.36,1);
  }

  .q-num{
    font-family:"Trebuchet MS",system-ui,sans-serif;color:var(--gold);
    letter-spacing:.3em;text-transform:uppercase;font-size:11px;font-weight:600;margin-bottom:10px;
  }
  .q-text{font-size:clamp(20px,4.5vw,26px);font-weight:600;margin:0 0 22px;color:#eaf3fb;line-height:1.25}

  .opts{display:flex;flex-direction:column;gap:12px}
  .opt{
    text-align:left;cursor:pointer;color:#dbe9f2;
    background:rgba(255,255,255,.025);
    border:1px solid rgba(255,255,255,.10);border-radius:11px;
    padding:15px 17px;font-size:16px;line-height:1.4;font-family:inherit;
    transition:border-color .15s, background .15s, transform .1s;
    position:relative;
  }
  .opt:hover{border-color:var(--gold);background:rgba(127,184,207,.10)}
  .opt:active{transform:scale(.995)}
  .opt:focus-visible{outline:2px solid var(--gold-bright);outline-offset:2px}
  .opt .marker{
    color:var(--gold);font-family:"Trebuchet MS",sans-serif;font-weight:700;
    font-size:13px;margin-right:10px;opacity:.8;
  }

  .nav{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:12px}
  .link{
    background:none;border:none;cursor:pointer;color:var(--ink-dim);
    font-family:"Trebuchet MS",sans-serif;font-size:13px;letter-spacing:.08em;
    text-transform:uppercase;padding:8px 4px;
  }
  .link:hover{color:var(--gold)}
  .link[disabled]{opacity:.3;cursor:default}
  .link:focus-visible{outline:2px solid var(--gold-bright);outline-offset:2px;border-radius:6px}

  /* result */
  .result-house{
    text-align:center;font-size:clamp(34px,9vw,64px);font-weight:600;margin:6px 0 4px;
    background:linear-gradient(180deg,#eaf6ff,#7fb8cf 140%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .result-motto{text-align:center;font-style:italic;color:var(--gold-bright);font-size:19px;margin:0 0 4px}
  .result-sigil{text-align:center;color:var(--ink-dim);font-size:13px;letter-spacing:.04em;margin:0 0 22px;
    font-family:"Trebuchet MS",sans-serif;text-transform:uppercase}
  .result-blurb{font-size:17px;color:#ddeaf2;margin:0 0 8px}

  .breakdown{margin-top:26px;border-top:1px solid var(--line);padding-top:20px}
  .breakdown h3{
    font-family:"Trebuchet MS",sans-serif;font-size:12px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--ink-dim);margin:0 0 14px;font-weight:600;
  }
  .row{display:grid;grid-template-columns:96px 1fr 40px;align-items:center;gap:10px;margin-bottom:9px}
  .row .name{font-size:13px;color:#cfe0ee;font-family:"Trebuchet MS",sans-serif}
  .row .track{height:7px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden}
  .row .track > i{display:block;height:100%;border-radius:99px;
    background:linear-gradient(90deg,#33506d,var(--gold))}
  .row .pct{font-size:12px;color:var(--ink-dim);text-align:right;font-family:"Trebuchet MS",sans-serif}
  .row.top .name{color:var(--gold-bright);font-weight:700}
  .row.top .track > i{background:linear-gradient(90deg,var(--blood),var(--gold-bright))}

  .hidden{display:none}
  .fade{animation:fade .45s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    .fade{animation:none}
    .bar>i,.row .track>i{transition:none}
  }
  footer{text-align:center;color:var(--ink-dim);font-size:12px;margin-top:34px;font-style:italic;opacity:.7}
</style>
</head>

ompro grano altrove, a qualsiasi prezzo", "w": {"Lannister": 2, "Hightower": 1, "Velaryon": 1, "Frey": 1}}]}, {"q": "Tuo fratello ti tradisce per il potere. Cosa provi soprattutto?", "a": [{"t": "Dolore: il sangue non dovrebbe fare questo", "w": {"Stark": 2, "Tully": 2, "Velaryon": 1}}, {"t": "Una fredda determinazione a vincere comunque", "w": {"Lannister": 2, "Bolton": 2, "Targaryen": 1}}, {"t": "Rabbia che chiede vendetta immediata", "w": {"Baratheon": 2, "Umber": 1, "Clegane": 1, "Bracken": 1}}, {"t": "Niente: me lo aspettavo", "w": {"Frey": 2, "Greyjoy": 2, "Hightower": 1, "Martell": 1}}]}, {"q": "Come ti vesti per un'occasione importante?", "a": [{"t": "Sobrio e pratico, senza ostentazione", "w": {"Stark": 2, "Mormont": 2, "Tarly": 1, "Umber": 1}}, {"t": "Splendido: l'apparenza è metà del potere", "w": {"Tyrell": 3, "Lannister": 1, "Targaryen": 1}}, {"t": "Con i colori e l'armatura della mia casa, sempre", "w": {"Bracken": 1, "Blackwood": 1, "Baratheon": 2, "Velaryon": 1}}, {"t": "Con qualcosa che intimorisca chi mi guarda", "w": {"Bolton": 3, "Clegane": 1}}]}, {"q": "Cosa ti spaventa di più?", "a": [{"t": "Perdere la mia gente", "w": {"Stark": 2, "Tully": 2, "Mormont": 1, "Velaryon": 1}}, {"t": "Cadere nell'oblio", "w": {"Targaryen": 2, "Lannister": 2, "Hightower": 1, "Blackfyre": 2}}, {"t": "Essere costretto a obbedire", "w": {"Greyjoy": 2, "Martell": 2, "Blackwood": 1, "Baratheon": 1}}, {"t": "Mostrare debolezza", "w": {"Bolton": 2, "Clegane": 2, "Tarly": 1, "Bracken": 1}}]}, {"q": "Un giovane della tua casa chiede consiglio sul matrimonio. Cosa gli dici?", "a": [{"t": "Sposa chi rafforza la nostra posizione", "w": {"Frey": 2, "Lannister": 2, "Hightower": 1, "Tyrell": 1}}, {"t": "Sposa chi rispetti e di cui ti fidi", "w": {"Stark": 2, "Tully": 2, "Mormont": 1}}, {"t": "Sposa chi vuoi: la vita è già abbastanza dura", "w": {"Baratheon": 2, "Martell": 2, "Greyjoy": 1}}, {"t": "Sposa con cura: certe unioni guariscono vecchie ferite, altre le riaprono", "w": {"Velaryon": 1, "Bracken": 1, "Blackwood": 1, "Arryn": 1, "Bolton": 1}}]}, {"q": "Preferiresti vincere una guerra...", "a": [{"t": "con una sola battaglia decisiva, faccia a faccia", "w": {"Baratheon": 2, "Umber": 2, "Clegane": 1, "Mormont": 1}}, {"t": "senza combattere affatto, con la diplomazia", "w": {"Tyrell": 2, "Hightower": 2, "Tully": 1, "Arryn": 1}}, {"t": "logorando il nemico finché crolla da solo", "w": {"Bolton": 2, "Stark": 1, "Frey": 1, "Tarly": 1}}, {"t": "colpendo dove non se lo aspetta", "w": {"Greyjoy": 2, "Bracken": 1, "Blackwood": 1, "Lannister": 1, "Martell": 1}}]}, {"q": "Cosa ti dà più soddisfazione?", "a": [{"t": "Vedere un piano lungo anni andare a segno", "w": {"Lannister": 2, "Hightower": 2, "Frey": 1, "Bolton": 1}}, {"t": "Un lavoro fatto bene con le mie mani", "w": {"Tarly": 1, "Mormont": 2, "Stark": 1, "Umber": 1}}, {"t": "Il momento in cui un avversario capisce di aver perso", "w": {"Bolton": 2, "Targaryen": 2, "Bracken": 1, "Martell": 1}}, {"t": "Una festa piena, con la mia gente felice", "w": {"Tully": 2, "Tyrell": 2, "Baratheon": 1}}]}, {"q": "Quale animale sceglieresti come simbolo?", "a": [{"t": "Un predatore solitario del nord", "w": {"Stark": 3, "Mormont": 1}}, {"t": "Una creatura del mare", "w": {"Greyjoy": 2, "Velaryon": 3}}, {"t": "Un uccello rapace", "w": {"Arryn": 3, "Blackwood": 1}}, {"t": "Una bestia che incute terrore", "w": {"Clegane": 1, "Bolton": 2, "Targaryen": 1, "Baratheon": 1, "Bracken": 1}}]}, {"q": "Ti viene chiesto di rompere un giuramento per un bene più grande. Tu?", "a": [{"t": "Non lo rompo: un giuramento è ciò che resta quando tutto crolla", "w": {"Stark": 3, "Tarly": 1, "Mormont": 1}}, {"t": "Lo rompo, se il bene è davvero più grande", "w": {"Tyrell": 1, "Baratheon": 2, "Targaryen": 1, "Tully": 1}}, {"t": "Lo rompo senza troppi scrupoli: i giuramenti sono strumenti", "w": {"Frey": 2, "Lannister": 1, "Greyjoy": 1, "Bolton": 1}}, {"t": "Dipende a chi l'ho giurato", "w": {"Bracken": 2, "Blackwood": 2, "Martell": 1, "Hightower": 1, "Blackfyre": 1}}]}, {"q": "Come ti comporti con i servi e la gente comune?", "a": [{"t": "Con giustizia: dipendono da me e io da loro", "w": {"Stark": 2, "Tully": 2, "Tarly": 1, "Arryn": 1}}, {"t": "Con cortesia studiata: l'affetto del popolo è potere", "w": {"Tyrell": 3, "Lannister": 1}}, {"t": "Sono lì per servire, nient'altro", "w": {"Bolton": 2, "Frey": 2, "Greyjoy": 1, "Clegane": 1}}, {"t": "Bevo e rido con loro come fossero pari", "w": {"Baratheon": 2, "Umber": 2, "Bracken": 1}}]}, {"q": "Qual è il tuo modo di affrontare il dolore fisico?", "a": [{"t": "Lo nascondo: nessuno deve vederlo", "w": {"Bolton": 2, "Tarly": 1, "Stark": 1, "Hightower": 1}}, {"t": "Lo uso come carburante per la rabbia", "w": {"Clegane": 3, "Umber": 1, "Baratheon": 1}}, {"t": "Lo sopporto perché devo, senza lamenti", "w": {"Mormont": 2, "Stark": 1, "Martell": 1, "Tarly": 1}}, {"t": "Lo grido al mondo: perché fingere?", "w": {"Greyjoy": 1, "Bracken": 1, "Tully": 1, "Umber": 1}}]}, {"q": "Quale frase ti rappresenta meglio?", "a": [{"t": "\"Quello che è morto non può morire\"", "w": {"Greyjoy": 3}}, {"t": "\"I miei rancori durano quanto il mio nome\"", "w": {"Bracken": 2, "Blackwood": 2, "Martell": 1}}, {"t": "\"Ricordo tutti i miei debiti, e tutti i miei crediti\"", "w": {"Lannister": 2, "Frey": 2}}, {"t": "\"Resisto perché altri possano vivere\"", "w": {"Stark": 2, "Tully": 1, "Velaryon": 1, "Mormont": 1}}]}, {"q": "Una nuova rotta commerciale potrebbe arricchirti, ma è pericolosa. Tu?", "a": [{"t": "La esploro io stesso, per primo", "w": {"Velaryon": 3, "Greyjoy": 1}}, {"t": "Investo e mando altri a rischiare", "w": {"Lannister": 2, "Hightower": 2, "Frey": 1}}, {"t": "Non mi interessa: la mia ricchezza è la terra", "w": {"Stark": 2, "Arryn": 2, "Umber": 1, "Tarly": 1}}, {"t": "La prendo con la forza, se serve", "w": {"Bracken": 1, "Baratheon": 1, "Greyjoy": 2, "Bolton": 1}}]}, {"q": "Cosa pensi di chi è nato senza nome o titolo?", "a": [{"t": "Conta ciò che fa, non da dove viene", "w": {"Baratheon": 1, "Mormont": 2, "Stark": 1, "Tully": 1}}, {"t": "Può salire, se è abbastanza utile e abile", "w": {"Lannister": 1, "Tyrell": 2, "Frey": 1, "Hightower": 1}}, {"t": "Il sangue conta, e non si può fingere", "w": {"Targaryen": 2, "Hightower": 1, "Velaryon": 1, "Arryn": 1, "Frey": 1, "Blackfyre": 2}}, {"t": "Mi è indifferente finché non mi intralcia", "w": {"Bolton": 2, "Greyjoy": 1, "Clegane": 1, "Bracken": 1}}]}, {"q": "Sei stato sconfitto pubblicamente. La tua prima mossa?", "a": [{"t": "Mi ritiro, riorganizzo, e torno più forte", "w": {"Stark": 1, "Tarly": 2, "Bolton": 2, "Hightower": 1}}, {"t": "Cerco subito una rivincita immediata", "w": {"Baratheon": 2, "Umber": 2, "Clegane": 1, "Bracken": 1}}, {"t": "Stringo nuove alleanze per ribaltare tutto", "w": {"Frey": 2, "Tyrell": 2, "Lannister": 1, "Martell": 1}}, {"t": "Non riconosco la sconfitta: non sono spezzato", "w": {"Martell": 3, "Greyjoy": 1, "Targaryen": 1, "Blackfyre": 2}}]}, {"q": "Quale dono offriresti a un re?", "a": [{"t": "La mia spada e il mio giuramento", "w": {"Stark": 2, "Tarly": 1, "Mormont": 1, "Baratheon": 1}}, {"t": "Un tesoro che nessun altro potrebbe permettersi", "w": {"Lannister": 3, "Hightower": 1}}, {"t": "Una nave costruita apposta per lui", "w": {"Velaryon": 3, "Greyjoy": 1}}, {"t": "Un consiglio che vale più di mille tesori", "w": {"Tyrell": 2, "Hightower": 2, "Frey": 1, "Bolton": 1}}]}, {"q": "Come reagisci al successo di un rivale?", "a": [{"t": "Lo riconosco apertamente, anche se mi pesa", "w": {"Stark": 2, "Baratheon": 1, "Tully": 1, "Mormont": 1}}, {"t": "Lo studio per capire come superarlo", "w": {"Lannister": 2, "Tarly": 2, "Hightower": 1}}, {"t": "Lo mino in silenzio, dall'interno", "w": {"Bolton": 2, "Frey": 2, "Tyrell": 1}}, {"t": "Mi infiamma e mi spinge a fare di più, subito", "w": {"Targaryen": 2, "Bracken": 2, "Baratheon": 1, "Umber": 1, "Blackfyre": 1}}]}, {"q": "Qual è la tua idea di una buona morte?", "a": [{"t": "In battaglia, con l'arma in pugno", "w": {"Umber": 2, "Clegane": 2, "Baratheon": 1, "Mormont": 1, "Greyjoy": 1}}, {"t": "Annegato nel mare che mi ha dato tutto", "w": {"Greyjoy": 2, "Velaryon": 2}}, {"t": "Vecchio, circondato dai miei, dopo aver fatto il mio dovere", "w": {"Stark": 2, "Tully": 2, "Arryn": 1, "Tarly": 1}}, {"t": "Tale che il mio nome non venga mai dimenticato", "w": {"Targaryen": 2, "Lannister": 2, "Hightower": 1, "Martell": 1}}]}, {"q": "Un segreto pericoloso ti viene confidato. Cosa ne fai?", "a": [{"t": "Lo custodisco: la fiducia è sacra", "w": {"Stark": 2, "Tully": 2, "Mormont": 1, "Velaryon": 1}}, {"t": "Lo conservo come una moneta da spendere al momento giusto", "w": {"Lannister": 2, "Frey": 2, "Hightower": 1, "Bolton": 1}}, {"t": "Lo verifico e lo aggiungo a ciò che già so", "w": {"Hightower": 2, "Tyrell": 1, "Bolton": 1, "Arryn": 1}}, {"t": "Decido in base a chi me lo ha dato e cosa ci guadagno", "w": {"Bracken": 1, "Martell": 1, "Targaryen": 1, "Greyjoy": 1, "Frey": 1}}]}, {"q": "Cosa apprezzi di più in una festa?", "a": [{"t": "Il vino e la musica fino all'alba", "w": {"Baratheon": 2, "Tully": 1, "Umber": 2, "Bracken": 1}}, {"t": "L'eleganza e le conversazioni raffinate", "w": {"Tyrell": 3, "Hightower": 1, "Lannister": 1}}, {"t": "Vedere chi parla con chi, e perché", "w": {"Lannister": 2, "Frey": 2, "Bolton": 1, "Martell": 1}}, {"t": "Preferirei non esserci affatto", "w": {"Stark": 2, "Arryn": 2, "Tarly": 1, "Mormont": 1}}]}, {"q": "Un comandante deve scegliere: salvare pochi suoi o colpire molti nemici. Tu?", "a": [{"t": "Salvo i miei: ogni vita sotto il mio comando conta", "w": {"Stark": 2, "Tully": 2, "Mormont": 2, "Velaryon": 1}}, {"t": "Colpisco: la vittoria salva più vite a lungo termine", "w": {"Tarly": 2, "Bolton": 2, "Targaryen": 1, "Lannister": 1}}, {"t": "Colpisco e basta: la guerra è guerra", "w": {"Clegane": 2, "Greyjoy": 1, "Bracken": 1, "Umber": 1}}, {"t": "Cerco una terza via che nessuno ha visto", "w": {"Tyrell": 2, "Hightower": 2, "Frey": 1}}]}, {"q": "Cosa pensi delle profezie e dei presagi?", "a": [{"t": "Hanno guidato la mia stirpe per secoli", "w": {"Targaryen": 3, "Hightower": 1}}, {"t": "Superstizioni: conta ciò che faccio io", "w": {"Bolton": 1, "Lannister": 1, "Tarly": 2, "Baratheon": 1}}, {"t": "Gli Antichi parlano, se sai ascoltarli", "w": {"Stark": 2, "Blackwood": 2, "Mormont": 1}}, {"t": "Le studio: anche una superstizione muove gli uomini", "w": {"Hightower": 2, "Tyrell": 1, "Frey": 1, "Martell": 1}}]}, {"q": "Devi nominare il tuo successore tra due figli ugualmente capaci. Come scegli?", "a": [{"t": "Il primogenito: l'ordine è tutto", "w": {"Frey": 2, "Arryn": 2, "Tarly": 1, "Hightower": 1}}, {"t": "Il più adatto a guidare, primogenito o no", "w": {"Tyrell": 2, "Martell": 2, "Velaryon": 1, "Lannister": 1}}, {"t": "Lascio che lo dimostrino con una prova", "w": {"Bolton": 2, "Greyjoy": 2, "Baratheon": 1, "Umber": 1}}, {"t": "Quello che ama di più la nostra gente", "w": {"Stark": 2, "Tully": 2, "Mormont": 1}}]}, {"q": "Qual è il tuo atteggiamento verso il cambiamento?", "a": [{"t": "Lo accolgo se ci rende più forti", "w": {"Targaryen": 2, "Velaryon": 2, "Tyrell": 1, "Lannister": 1}}, {"t": "Diffido: ciò che dura ha già provato di valere", "w": {"Stark": 2, "Arryn": 2, "Frey": 1, "Tarly": 1}}, {"t": "Lo cavalco a mio vantaggio", "w": {"Lannister": 2, "Frey": 1, "Hightower": 1, "Bolton": 1}}, {"t": "Lo affronto come affronto tutto: di petto", "w": {"Baratheon": 2, "Umber": 2, "Bracken": 1, "Greyjoy": 1}}]}, {"q": "Come ti senti quando sei lontano da casa per molto tempo?", "a": [{"t": "Inquieto: una parte di me resta sempre lì", "w": {"Stark": 3, "Tully": 1, "Arryn": 1, "Mormont": 1}}, {"t": "A mio agio: casa è dove mi trovo", "w": {"Greyjoy": 2, "Velaryon": 2, "Targaryen": 1}}, {"t": "Concentrato sull'obiettivo che mi ha portato via", "w": {"Tarly": 2, "Bolton": 1, "Lannister": 1, "Hightower": 1}}, {"t": "Pronto a tornare e regolare i conti rimasti aperti", "w": {"Bracken": 2, "Blackwood": 2, "Umber": 1}}]}, {"q": "Un nemico ti offre un'alleanza vantaggiosa. Tu?", "a": [{"t": "La rifiuto: certe inimicizie non si vendono", "w": {"Bracken": 2, "Blackwood": 2, "Martell": 1, "Umber": 1}}, {"t": "La accetto, mettendo da parte l'orgoglio per il bene comune", "w": {"Tully": 2, "Tyrell": 2, "Velaryon": 1, "Stark": 1}}, {"t": "La accetto, pronto a tradirlo per primo", "w": {"Frey": 2, "Bolton": 1, "Greyjoy": 1, "Lannister": 1}}, {"t": "La valuto freddamente, senza sentimenti", "w": {"Hightower": 2, "Lannister": 1, "Tarly": 1, "Targaryen": 1}}]}, {"q": "Cosa ammiri di più in un grande condottiero del passato?", "a": [{"t": "La sua disciplina e organizzazione", "w": {"Tarly": 3, "Bolton": 1, "Hightower": 1}}, {"t": "Il suo coraggio personale in prima linea", "w": {"Baratheon": 2, "Umber": 2, "Mormont": 1, "Clegane": 1}}, {"t": "La sua astuzia e i suoi inganni", "w": {"Lannister": 2, "Frey": 1, "Tyrell": 1, "Martell": 1}}, {"t": "La sua capacità di ispirare devozione", "w": {"Stark": 2, "Tully": 1, "Targaryen": 1, "Velaryon": 1}}]}, {"q": "Hai un'intera giornata di potere assoluto sul reame. La prima cosa che fai?", "a": [{"t": "Sistemo le leggi perché siano giuste per tutti", "w": {"Stark": 1, "Tully": 2, "Arryn": 2, "Tarly": 1}}, {"t": "Consolido la mia famiglia ai posti che contano", "w": {"Lannister": 2, "Frey": 2, "Hightower": 1}}, {"t": "Lancio una grande impresa che mi renda leggenda", "w": {"Targaryen": 3, "Velaryon": 1}}, {"t": "Schiaccio i miei vecchi nemici una volta per tutte", "w": {"Bracken": 2, "Bolton": 2, "Greyjoy": 1, "Clegane": 1, "Blackfyre": 1}}]}, {"q": "Come ti rapporti con chi ti adula?", "a": [{"t": "Diffido: gli adulatori nascondono sempre qualcosa", "w": {"Stark": 2, "Bolton": 2, "Tarly": 1, "Arryn": 1}}, {"t": "Lo gradisco, ma non mi fido", "w": {"Lannister": 2, "Hightower": 1, "Tyrell": 1, "Martell": 1}}, {"t": "Mi infastidisce: ditemi le cose come stanno", "w": {"Baratheon": 2, "Umber": 2, "Mormont": 1, "Greyjoy": 1}}, {"t": "Lo uso: chi adula è facile da manovrare", "w": {"Frey": 2, "Tyrell": 1, "Bolton": 1, "Bracken": 1}}]}, {"q": "Qual è il prezzo che non pagheresti mai, per nessun trono?", "a": [{"t": "La mia parola e il mio onore", "w": {"Stark": 3, "Mormont": 1, "Tarly": 1}}, {"t": "La sicurezza dei miei", "w": {"Tully": 3, "Velaryon": 1, "Mormont": 1}}, {"t": "La mia libertà di non inginocchiarmi", "w": {"Greyjoy": 2, "Martell": 2, "Blackwood": 1, "Baratheon": 1}}, {"t": "Nessuno: per il trono giusto pagherei qualunque prezzo", "w": {"Targaryen": 2, "Lannister": 2, "Frey": 1, "Bolton": 1, "Blackfyre": 2}}]}, {"q": "Una vecchia rivale di famiglia ti supera in tutto. Cosa ti brucia di più?", "a": [{"t": "Che proprio loro, tra tutti, abbiano la meglio", "w": {"Bracken": 3, "Blackwood": 3}}, {"t": "Che il mio nome scivoli nell'ombra", "w": {"Lannister": 1, "Targaryen": 1, "Hightower": 2, "Tyrell": 1, "Blackfyre": 2}}, {"t": "Niente: invidiare è perdere tempo", "w": {"Stark": 1, "Mormont": 2, "Arryn": 1, "Velaryon": 1}}, {"t": "Che non possa affrontarli apertamente", "w": {"Umber": 2, "Baratheon": 2, "Greyjoy": 1, "Clegane": 1}}]}, {"q": "Come prendi le decisioni difficili?", "a": [{"t": "Da solo, in silenzio, dopo aver riflettuto a lungo", "w": {"Stark": 2, "Bolton": 2, "Arryn": 1, "Hightower": 1}}, {"t": "Consultando i miei più fidati", "w": {"Tully": 2, "Velaryon": 2, "Tarly": 1, "Mormont": 1}}, {"t": "Di pancia: di solito ho ragione", "w": {"Baratheon": 2, "Bracken": 2, "Umber": 1, "Greyjoy": 1}}, {"t": "Soppesando ogni vantaggio possibile", "w": {"Lannister": 2, "Frey": 2, "Tyrell": 1, "Targaryen": 1}}]}, {"q": "Quale ricordo d'infanzia ti suona più familiare?", "a": [{"t": "Imparare a impugnare un'arma prima di saper leggere", "w": {"Umber": 2, "Mormont": 2, "Clegane": 1, "Bracken": 1, "Greyjoy": 1}}, {"t": "Ore passate tra libri e maestri", "w": {"Hightower": 3, "Lannister": 1, "Tyrell": 1}}, {"t": "Sentirmi dire quanto antico e grande fosse il mio nome", "w": {"Targaryen": 2, "Hightower": 1, "Frey": 1, "Velaryon": 1, "Martell": 1, "Blackfyre": 2}}, {"t": "Giocare libero tra boschi e cortili", "w": {"Stark": 2, "Tully": 2, "Baratheon": 1}}]}, {"q": "Cosa faresti se scoprissi che la tua intera fortuna si fonda su una vecchia menzogna?", "a": [{"t": "La rivelerei: vivere nella verità conta più della fortuna", "w": {"Stark": 2, "Tarly": 1, "Tully": 1, "Mormont": 1}}, {"t": "La seppellirei più a fondo", "w": {"Lannister": 2, "Frey": 2, "Hightower": 1, "Bolton": 1}}, {"t": "La trasformerei in una leggenda ancora più grande", "w": {"Targaryen": 2, "Tyrell": 2, "Velaryon": 1, "Blackfyre": 1}}, {"t": "Non cambierebbe nulla: il potere è potere", "w": {"Bolton": 1, "Greyjoy": 2, "Bracken": 1, "Clegane": 1}}]}, {"q": "L'inverno arriva e durerà anni. Come ti prepari?", "a": [{"t": "Riempio i granai e organizzo ogni risorsa con metodo", "w": {"Stark": 3, "Tarly": 1, "Tully": 1}}, {"t": "Compro tutto il necessario, ovunque, a qualunque prezzo", "w": {"Lannister": 2, "Hightower": 2, "Frey": 1, "Velaryon": 1}}, {"t": "Prenderò ciò che serve da chi non si è preparato", "w": {"Greyjoy": 3, "Bracken": 1, "Bolton": 1}}, {"t": "L'inverno non mi spaventa: la mia gente è dura", "w": {"Umber": 2, "Mormont": 2, "Stark": 1}}]}, {"q": "Quale ti suona più come un complimento e quale come un'offesa? Scegli ciò che ti definisce di più:", "a": [{"t": "\"Sei prevedibile\" — e va bene così, perché sono affidabile", "w": {"Stark": 2, "Tully": 1, "Tarly": 2, "Mormont": 1}}, {"t": "\"Sei spietato\" — e lo prendo come un fatto, non un'accusa", "w": {"Bolton": 3, "Clegane": 1, "Greyjoy": 1}}, {"t": "\"Sei imprevedibile\" — esattamente come voglio essere", "w": {"Lannister": 1, "Tyrell": 2, "Martell": 1, "Bracken": 1, "Targaryen": 1}}, {"t": "\"Sei testardo\" — chiamalo come vuoi, io non mollo", "w": {"Umber": 2, "Blackwood": 1, "Bracken": 1, "Baratheon": 1, "Martell": 1}}]}, {"q": "Infine: cosa vorresti che la gente sentisse pronunciando il tuo nome?", "a": [{"t": "Rispetto e fiducia", "w": {"Stark": 2, "Tully": 2, "Arryn": 1, "Mormont": 1, "Velaryon": 1}}, {"t": "Soggezione per la grandezza", "w": {"Targaryen": 2, "Hightower": 2, "Lannister": 1, "Tyrell": 1, "Blackfyre": 1}}, {"t": "Un brivido di paura", "w": {"Bolton": 2, "Clegane": 2, "Greyjoy": 1, "Bracken": 1}}, {"t": "Il calore di chi sa che ci sarò", "w": {"Tully": 1, "Baratheon": 2, "Umber": 2, "Mormont": 1}}]}, {"q": "Un falco si posa sul tuo braccio durante un consiglio teso. Cosa fai?", "a": [{"t": "Lo lascio stare e proseguo: la calma vale più di qualsiasi gesto", "w": {"Arryn": 3, "Hightower": 1, "Stark": 1}}, {"t": "Lo accarezzo e lo uso per spezzare la tensione a mio favore", "w": {"Tyrell": 2, "Lannister": 1, "Martell": 1, "Arryn": 1}}, {"t": "Lo scaccio: non c'è tempo per simili distrazioni", "w": {"Tarly": 2, "Bolton": 1, "Baratheon": 1, "Clegane": 1}}, {"t": "Penso che sia un presagio e cerco di leggerlo", "w": {"Blackwood": 3, "Targaryen": 1, "Arryn": 1}}]}, {"q": "Ti chiedono di sorvegliare un confine remoto e dimenticato per anni. Tu?", "a": [{"t": "Accetto con orgoglio: i confini si difendono comunque", "w": {"Mormont": 2, "Umber": 2, "Arryn": 2, "Stark": 1}}, {"t": "Cerco di scambiarlo con un incarico più visibile", "w": {"Frey": 2, "Lannister": 1, "Tyrell": 1, "Hightower": 1}}, {"t": "Lo trasformo in una base per le mie ambizioni", "w": {"Bolton": 2, "Greyjoy": 1, "Bracken": 1, "Targaryen": 1, "Velaryon": 1, "Blackfyre": 2}}, {"t": "Lo accetto solo se protegge davvero qualcuno a cui tengo", "w": {"Tully": 2, "Velaryon": 2, "Stark": 1, "Mormont": 1}}]}, {"q": "Hai un solo desiderio che si avvererà di sicuro. Quale esprimi?", "a": [{"t": "Che la mia gente sia al sicuro per generazioni", "w": {"Stark": 2, "Tully": 2, "Mormont": 1, "Velaryon": 1, "Arryn": 1}}, {"t": "Che il mio antico nemico cada, finalmente", "w": {"Bracken": 2, "Blackwood": 2, "Clegane": 2, "Martell": 1, "Blackfyre": 2}}, {"t": "Che il mio nome diventi immortale", "w": {"Targaryen": 2, "Lannister": 1, "Hightower": 2, "Tyrell": 1, "Blackfyre": 1}}, {"t": "Il mare aperto e nessun padrone sopra di me", "w": {"Greyjoy": 3, "Velaryon": 2, "Baratheon": 1}}]}], "houses": {"Stark": {"motto": "L'inverno sta arrivando", "sigil": "Metalupo grigio in campo bianco ghiaccio", "blurb": "Antichi re del Nord, fedeli agli dèi antichi e a un onore severo come la neve. Per te il dovere non è una scelta ma la spina dorsale di chi sei: emetti la sentenza e impugni tu stesso la spada. Diffidi della corte del Sud e dei suoi intrighi, e il tuo posto sarà sempre tra le mura di casa, accanto alla tua gente."}, "Lannister": {"motto": "Udite il mio ruggito", "sigil": "Leone dorato in campo porpora", "blurb": "Discendente di Lann l'Astuto, ricco come le miniere di Castel Granito. Tieni il conto di ogni debito e di ogni credito, e un Lannister paga sempre i suoi debiti — in oro o altrimenti. Pazienza, orgoglio e calcolo: lasci che gli altri ti credano prevedibile mentre il tuo piano matura nell'ombra."}, "Targaryen": {"motto": "Fuoco e sangue", "sigil": "Drago tricipite rosso in campo nero", "blurb": "Sangue dell'antica Valyria, abituato a guardare il mondo dall'alto. L'ambizione ti scorre nelle vene come fuoco: vuoi un nome che il tempo non possa cancellare. Le profezie e le grandi imprese ti chiamano, e ciò che desideri davvero, lo prendi."}, "Arryn": {"motto": "In alto quanto l'onore", "sigil": "Falcone bianco e luna in campo azzurro cielo", "blurb": "Signore del Nido dell'Aquila, l'inespugnabile castello tra le nuvole. Cauto, paziente, geloso della tua sicurezza: non apri le porte chiuse senza un buon motivo e non corri rischi inutili. L'onore per te è un'altitudine — qualcosa a cui si tende, non un gesto plateale."}, "Tyrell": {"motto": "Crescere forti", "sigil": "Rosa dorata in campo verde erba", "blurb": "Saliti dal ruolo di attendenti al trono di Alto Giardino con cortesia e abilità. Sai che l'affetto del popolo è potere e che un sorriso disarma più di una spada. Coltivi alleanze come si coltiva un giardino: con pazienza, eleganza e un occhio sempre attento a ciò che fiorirà."}, "Martell": {"motto": "Mai inchinati, mai piegati, mai spezzati", "sigil": "Sole rosso trafitto da una lancia", "blurb": "Principi di Dorne, indomiti sotto il loro sole feroce. Nessun drago vi ha mai piegati. Orgoglioso e indipendente, non dimentichi un torto e servi la tua vendetta fredda, quando il momento è perfetto. Decidi le tue regole, e non ti inginocchi mai a chi non lo merita."}, "Baratheon": {"motto": "Nostra è la furia", "sigil": "Cervo coronato nero in campo oro", "blurb": "Forte come la tempesta che batte Capo Tempesta. Affronti tutto di petto: la battaglia, l'insulto, la vita stessa. Coraggioso, schietto, incapace di fingere — preferisci una sola battaglia decisiva faccia a faccia a mille intrighi. Bevi, ridi e combatti con tutto il cuore."}, "Tully": {"motto": "Famiglia, dovere, onore", "sigil": "Trota argentea in campo blu e rosso", "blurb": "Signori di Delta delle Acque, dove i fiumi si incontrano. Per te vengono prima le persone: apri i granai nella carestia, custodisci i segreti, chiudi le faide. La famiglia non è solo sangue ma tutti coloro che dipendono da te — e tu non li deludi mai."}, "Greyjoy": {"motto": "Noi non seminiamo", "sigil": "Piovra dorata in campo nero", "blurb": "Uomini di ferro delle isole, fieri della loro feroce libertà. Non semini: prendi ciò che ti serve dal mare e da chi è troppo debole per tenerlo. Casa è il ponte della tua nave, e ciò che è morto non può morire. Nessun padrone, nessuna catena."}, "Hightower": {"motto": "Noi illuminiamo la via", "sigil": "Torre di pietra coronata di fiamma in campo grigio", "blurb": "La casata più antica e ricca di Vecchia Città, custode della Cittadella e del sapere. Prudente e devoto, apri le porte quando la forza è inutile e tieni i tuoi libri come altri tengono le spade. Sai che la conoscenza paziente sopravvive a ogni conquistatore."}, "Velaryon": {"motto": "L'antico, il vero, il coraggioso", "sigil": "Cavalluccio marino argenteo in campo blu acqua", "blurb": "Antico sangue valyriano legato al mare più che alla terra. Esplori per primo le rotte pericolose, costruisci flotte che portano il tuo nome oltre l'orizzonte. Leale e coraggioso, la tua casa è ovunque ti porti la marea, e la tua ricchezza viene dalle onde."}, "Bolton": {"motto": "I nostri coltelli sono affilati", "sigil": "Uomo scuoiato in campo rosa sangue", "blurb": "Antichi signori di Forte Terrore, dalla reputazione tanto temuta quanto antica. Freddo, paziente, calcolatore: un uomo nudo ha pochi segreti, dici, e tu ne sai qualcosa. Non mostri mai debolezza, non concedi pietà gratuita, e lasci che il tuo nome faccia il lavoro della paura."}, "Tarly": {"motto": "Primi in battaglia", "sigil": "Cacciatore a grandi passi in campo verde e argento", "blurb": "Signori della Collina del Corno, famosi per la disciplina marziale. Per te l'ordine, l'addestramento e la strategia vincono le guerre. Severo con te stesso prima che con gli altri, temperi gli eredi con prove dure e comandi la manovra mentre altri cercano la gloria della prima linea."}, "Mormont": {"motto": "Qui restiamo", "sigil": "Orso nero in campo verde", "blurb": "Della rude Isola dell'Orso, dove anche le donne brandiscono la spada senza che nessuno discuta. Schietto, leale, instancabile: conti ciò che uno fa, non da dove viene. Sopporti il dolore senza lamenti, difendi i confini dimenticati e resti al tuo posto qualunque cosa accada."}, "Clegane": {"motto": "(nessun motto nobile — solo tre cani neri in campo giallo)", "sigil": "Tre cani neri in campo giallo", "blurb": "Una casata giovane e violenta, cresciuta servendo con la forza bruta. Rispondi all'insulto coi pugni, sfondi le porte invece di aggirarle, e usi il dolore come carburante per la rabbia. Diretto fino alla brutalità, disprezzi le sottigliezze e la falsa cortesia della corte."}, "Bracken": {"motto": "Nessuno sa quale (la rivalità è eterna)", "sigil": "Cavallo rosso e sole dorato in campo marrone", "blurb": "Signori delle terre dei fiumi, legati da una faida antica e inestinguibile con i Blackwood. Impulsivo, orgoglioso, incapace di lasciar correre un torto: certi rancori durano quanto il tuo nome. Affronti i nemici apertamente e ciò che ti brucia di più è vedere proprio loro avere la meglio."}, "Blackwood": {"motto": "(custodi degli antichi dèi e dell'albero-diga)", "sigil": "Stormo di corvi e albero-diga in campo rosso", "blurb": "Antichi signori dei fiumi, fedeli agli dèi antichi e nemici giurati dei Bracken. Leggi i presagi, ascolti il silenzio degli alberi e non dimentichi un'offesa. Colpisci dove non ti aspettano e porti i tuoi rancori con la stessa cura con cui custodisci le vecchie tradizioni."}, "Umber": {"motto": "(la forza grezza del Grande Jon)", "sigil": "Gigante che spezza catene in campo argento", "blurb": "Alfieri degli Stark dall'estremo Nord, enormi, rumorosi e feroci. Testardo e impulsivo, dici le cose come stanno e affronti la vita di petto. Impari a impugnare un'arma prima ancora di saper leggere, e la tua lealtà, una volta data, è incrollabile come il ghiaccio."}, "Frey": {"motto": "(nessun motto antico — sono saliti col Guado)", "sigil": "Due torri unite da un ponte in campo argento e blu", "blurb": "Signori del Guado, padroni delle Torri Gemelle e di tutti coloro che vogliono attraversare il fiume. Opportunista e tenace, tieni il conto preciso di ogni favore e di ogni sgarbo. Sai di non avere il sangue più antico, e proprio per questo non lasci mai sfuggire un'occasione per salire."}, "Blackfyre": {"motto": "(il drago nero — i colori Targaryen rovesciati)", "sigil": "Drago nero tricipite in campo rosso", "blurb": "Sangue del drago, ma nato dal lato sbagliato della successione: discendi da Daemon Blackfyre, il bastardo legittimato che impugnò la spada del Conquistatore e rivendicò un trono che riteneva suo di diritto. Orgoglioso e implacabile, porti il peso di un'esclusione che brucia da generazioni. Quattro ribellioni fallite non hanno spento la tua convinzione: l'esilio oltre il Mare Stretto, la Compagnia Dorata al tuo fianco e un rancore che non conosce resa. Ciò che ti è stato negato, tornerai a reclamarlo."}}}, "en": {"quiz": [{"q": "A guest arrives at your gate during a storm. You don't know him, and rumor says he's an enemy. What do you do?", "a": [{"t": "I take him in: bread and salt are refused to no one", "w": {"Stark": 3, "Tully": 2, "Umber": 2, "Mormont": 1}}, {"t": "I take him in, but have him watched at every turn", "w": {"Bolton": 3, "Frey": 2, "Lannister": 1, "Hightower": 1}}, {"t": "I take him in and put him at ease: a disarmed enemy is the easiest to listen to", "w": {"Tyrell": 3, "Martell": 2, "Lannister": 1}}, {"t": "I decide the rules under my own roof, guest or not", "w": {"Greyjoy": 3, "Baratheon": 1, "Bracken": 1}}]}, {"q": "You're offered a seat of power at court, far from home. Do you accept?", "a": [{"t": "No, my place is on my own lands", "w": {"Stark": 3, "Mormont": 2, "Arryn": 1}}, {"t": "Yes, the realm's fate is decided close to the king", "w": {"Lannister": 3, "Tyrell": 2, "Hightower": 1, "Frey": 1}}, {"t": "Only if it guarantees better protection for my own", "w": {"Tully": 3, "Velaryon": 1, "Tarly": 1}}, {"t": "I'd take it anyway, and use it my own way", "w": {"Targaryen": 2, "Baratheon": 2, "Bracken": 2, "Blackfyre": 2}}]}, {"q": "What sound do you prefer to wake up to?", "a": [{"t": "Wind through the trees and silence", "w": {"Stark": 3, "Blackwood": 2, "Arryn": 1}}, {"t": "Waves beating against the hull", "w": {"Greyjoy": 3, "Velaryon": 3}}, {"t": "A castle stirring to serve me", "w": {"Lannister": 2, "Tyrell": 2, "Frey": 1, "Hightower": 1}}, {"t": "Dogs barking in the kennels", "w": {"Clegane": 3, "Bolton": 2, "Bracken": 1}}]}, {"q": "One of your vassals has betrayed you. He's in your power. How do you proceed?", "a": [{"t": "I carry out the sentence myself: whoever passes judgment must swing the sword", "w": {"Stark": 3, "Mormont": 2, "Umber": 1}}, {"t": "I make it last a long time, so others learn", "w": {"Bolton": 3, "Clegane": 2}}, {"t": "I pardon him publicly and use him forever after", "w": {"Tyrell": 2, "Lannister": 2, "Martell": 1, "Frey": 1}}, {"t": "I drown him: the Drowned God takes what is owed him", "w": {"Greyjoy": 3}}]}, {"q": "Which seems the worst humiliation to you?", "a": [{"t": "Kneeling before someone who doesn't deserve it", "w": {"Martell": 3, "Greyjoy": 2, "Blackwood": 1, "Baratheon": 1}}, {"t": "Being seen as an upstart, with no true lineage", "w": {"Tyrell": 2, "Hightower": 2, "Frey": 2}}, {"t": "Watching your own name be forgotten", "w": {"Targaryen": 2, "Lannister": 2, "Velaryon": 1, "Blackfyre": 2}}, {"t": "Being treated like a fool when you're the stronger one", "w": {"Clegane": 2, "Umber": 2, "Bracken": 2}}]}, {"q": "You have a free night with no duties. How do you spend it?", "a": [{"t": "With a rare book and a candle", "w": {"Hightower": 3, "Tyrell": 1, "Lannister": 1}}, {"t": "Training until my arms give out", "w": {"Tarly": 2, "Mormont": 2, "Baratheon": 2, "Clegane": 1}}, {"t": "Drinking and singing with those loyal to me", "w": {"Baratheon": 2, "Umber": 2, "Tully": 1, "Bracken": 1}}, {"t": "Watching the horizon and planning the next voyage", "w": {"Velaryon": 3, "Targaryen": 1, "Greyjoy": 1}}]}, {"q": "What quality do you value most in those who serve you?", "a": [{"t": "Absolute loyalty, even in error", "w": {"Stark": 2, "Tully": 2, "Mormont": 2, "Umber": 1}}, {"t": "Cold competence, with no need for affection", "w": {"Bolton": 3, "Tarly": 2, "Hightower": 1}}, {"t": "The ability to be useful and never indispensable", "w": {"Lannister": 2, "Frey": 2, "Tyrell": 1}}, {"t": "Physical courage, whatever the price", "w": {"Baratheon": 2, "Clegane": 2, "Greyjoy": 1, "Bracken": 1}}]}, {"q": "An old family feud could finally end with a marriage. Do you?", "a": [{"t": "I end it: spilled blood isn't worth more blood", "w": {"Tully": 2, "Stark": 2, "Velaryon": 1}}, {"t": "I end it in appearance only, and keep the distrust alive", "w": {"Frey": 3, "Bolton": 1, "Lannister": 1}}, {"t": "I would never end it: some wrongs aren't forgotten", "w": {"Blackwood": 3, "Bracken": 3, "Martell": 1}}, {"t": "I use it to gain something greater", "w": {"Tyrell": 2, "Hightower": 2, "Targaryen": 1}}]}, {"q": "How do you react to a public insult?", "a": [{"t": "With icy calm: whoever insults has already exposed himself", "w": {"Bolton": 2, "Hightower": 2, "Arryn": 1, "Stark": 1}}, {"t": "I respond at once, with my fists if need be", "w": {"Clegane": 2, "Umber": 2, "Baratheon": 2, "Bracken": 1}}, {"t": "I smile and take note for later", "w": {"Lannister": 2, "Tyrell": 2, "Martell": 1, "Frey": 1}}, {"t": "I ignore it: my name speaks for itself", "w": {"Targaryen": 2, "Martell": 2, "Velaryon": 1}}]}, {"q": "Which landscape feels most \"yours\"?", "a": [{"t": "Snow-covered forests and grey skies", "w": {"Stark": 3, "Umber": 2, "Mormont": 1}}, {"t": "Rocky coasts pounded by the sea", "w": {"Greyjoy": 3, "Velaryon": 2, "Arryn": 1}}, {"t": "Golden fields and blooming gardens", "w": {"Tyrell": 3, "Tully": 1}}, {"t": "Red desert under a fierce sun", "w": {"Martell": 3}}]}, {"q": "You must choose one weapon for the rest of your life. Which?", "a": [{"t": "A two-handed greatsword that demands raw strength", "w": {"Clegane": 2, "Umber": 2, "Baratheon": 2, "Tarly": 1}}, {"t": "A longbow, to strike before being seen", "w": {"Blackwood": 2, "Bracken": 1, "Tarly": 1, "Bolton": 1}}, {"t": "A thin, swift blade", "w": {"Martell": 2, "Lannister": 1, "Targaryen": 1}}, {"t": "The axe and the ship that carries me to the enemy", "w": {"Greyjoy": 3, "Velaryon": 1}}]}, {"q": "A singer writes a ballad about you. What do you hope it says?", "a": [{"t": "That I did my duty to the very end", "w": {"Stark": 3, "Tully": 2, "Tarly": 1, "Mormont": 1}}, {"t": "That no one ever broke me", "w": {"Martell": 3, "Greyjoy": 2, "Blackwood": 1}}, {"t": "That I was the cleverest of them all", "w": {"Lannister": 3, "Frey": 1, "Tyrell": 1}}, {"t": "That my name struck terror", "w": {"Bolton": 3, "Clegane": 2, "Targaryen": 1}}]}, {"q": "How much does money matter to you?", "a": [{"t": "It's a tool: I accumulate it and make it grow", "w": {"Lannister": 3, "Hightower": 1, "Frey": 1}}, {"t": "It matters less than land and name", "w": {"Stark": 2, "Arryn": 2, "Mormont": 2}}, {"t": "I take it where I find it, I don't cultivate it", "w": {"Greyjoy": 3, "Bracken": 1}}, {"t": "It serves to fund ambitions greater than itself", "w": {"Targaryen": 2, "Velaryon": 2, "Baratheon": 1, "Tyrell": 1}}]}, {"q": "A child of your house shows cruelty toward animals. How do you react?", "a": [{"t": "I correct him harshly: needless cruelty is weakness", "w": {"Stark": 2, "Tarly": 2, "Tully": 1, "Mormont": 1}}, {"t": "I watch: perhaps he understands something others don't see", "w": {"Bolton": 3, "Clegane": 1}}, {"t": "I train him to channel it where it's useful", "w": {"Lannister": 1, "Targaryen": 1, "Bracken": 1, "Hightower": 1}}, {"t": "I don't concern myself: he'll learn from life", "w": {"Greyjoy": 2, "Umber": 1, "Baratheon": 1}}]}, {"q": "You'd rather be...", "a": [{"t": "Feared", "w": {"Bolton": 3, "Targaryen": 1, "Clegane": 1, "Blackfyre": 1}}, {"t": "Respected", "w": {"Stark": 2, "Arryn": 2, "Tarly": 2, "Hightower": 1}}, {"t": "Loved", "w": {"Tully": 2, "Tyrell": 2, "Baratheon": 1, "Mormont": 1}}, {"t": "Free", "w": {"Greyjoy": 3, "Martell": 2, "Blackwood": 1}}]}, {"q": "Your heir is not fit to rule. What do you do?", "a": [{"t": "I prepare him anyway: blood is blood", "w": {"Frey": 2, "Targaryen": 2, "Lannister": 1, "Velaryon": 1, "Blackfyre": 2}}, {"t": "I entrust power to whoever is capable, even outside the bloodline", "w": {"Tyrell": 2, "Hightower": 2, "Martell": 1}}, {"t": "I temper him with hard trials until he grows", "w": {"Tarly": 2, "Bolton": 2, "Umber": 1, "Mormont": 1}}, {"t": "I let him fail and let the strong prevail", "w": {"Greyjoy": 2, "Baratheon": 2, "Bracken": 1}}]}, {"q": "What do you think of old traditions?", "a": [{"t": "They are what we are: to be defended at any cost", "w": {"Stark": 2, "Greyjoy": 2, "Martell": 1, "Hightower": 1}}, {"t": "Useful while they serve, forgettable when they become a burden", "w": {"Lannister": 2, "Tyrell": 2, "Frey": 1}}, {"t": "Ancient and sacred, but also a weapon to wield", "w": {"Bolton": 2, "Targaryen": 2, "Bracken": 1, "Blackwood": 1, "Blackfyre": 2}}, {"t": "I respect them if they've stood the test of time", "w": {"Arryn": 2, "Tully": 2, "Velaryon": 1, "Tarly": 1}}]}, {"q": "In battle, where do they find you?", "a": [{"t": "On the front line, where the melee is thickest", "w": {"Umber": 2, "Baratheon": 2, "Clegane": 2, "Mormont": 1}}, {"t": "On the flank, commanding the maneuver", "w": {"Tarly": 3, "Bolton": 1, "Hightower": 1}}, {"t": "Where no one expects me, behind the enemy's back", "w": {"Bracken": 1, "Blackwood": 1, "Lannister": 1, "Greyjoy": 1, "Bolton": 1}}, {"t": "High above, where the war is truly decided", "w": {"Targaryen": 3, "Velaryon": 1, "Blackfyre": 2}}]}, {"q": "What is your relationship with the gods?", "a": [{"t": "I pray to the Old Gods, in silence, before the trees", "w": {"Stark": 3, "Blackwood": 2, "Mormont": 1}}, {"t": "I honor the Seven with devotion and ceremony", "w": {"Tyrell": 2, "Hightower": 3, "Tully": 1, "Arryn": 1}}, {"t": "I serve a god who asks and takes", "w": {"Greyjoy": 3}}, {"t": "The gods are useful to men, not the other way around", "w": {"Lannister": 2, "Bolton": 2, "Frey": 1, "Bracken": 1}}]}, {"q": "You're told you were wrong. How do you take it?", "a": [{"t": "I admit it and correct it: pride isn't worth more than the truth", "w": {"Stark": 2, "Tarly": 2, "Tully": 1}}, {"t": "I rarely admit it in public", "w": {"Lannister": 2, "Targaryen": 2, "Martell": 1, "Arryn": 1, "Blackfyre": 1}}, {"t": "It depends on who tells me", "w": {"Frey": 2, "Bolton": 1, "Hightower": 1, "Bracken": 1}}, {"t": "I fly into a rage before reasoning it out", "w": {"Baratheon": 2, "Clegane": 2, "Umber": 2, "Greyjoy": 1}}]}, {"q": "What would you save from a burning castle?", "a": [{"t": "The writings and the knowledge", "w": {"Hightower": 3, "Lannister": 1, "Targaryen": 1}}, {"t": "The family sword", "w": {"Stark": 2, "Tarly": 2, "Mormont": 2, "Umber": 1}}, {"t": "The people, before any object", "w": {"Tully": 3, "Mormont": 1, "Baratheon": 1}}, {"t": "The gold and the contracts", "w": {"Lannister": 2, "Frey": 3}}]}, {"q": "How do you treat someone who owes you a favor?", "a": [{"t": "I don't remind them: generosity binds more than debt", "w": {"Tyrell": 2, "Tully": 2, "Velaryon": 1}}, {"t": "I keep precise count, and collect it at the right moment", "w": {"Lannister": 3, "Frey": 2}}, {"t": "A debt of honor must be settled, one way or another", "w": {"Stark": 1, "Martell": 2, "Bracken": 1, "Blackwood": 1}}, {"t": "I use it as leverage, as long as I can", "w": {"Bolton": 2, "Hightower": 1, "Targaryen": 1}}]}, {"q": "Which weighs on you most?", "a": [{"t": "Standing still when I could act", "w": {"Baratheon": 2, "Targaryen": 2, "Bracken": 1, "Greyjoy": 1}}, {"t": "Acting on impulse and regretting it", "w": {"Hightower": 2, "Arryn": 2, "Tarly": 1, "Bolton": 1}}, {"t": "Disappointing someone who counts on me", "w": {"Stark": 2, "Tully": 2, "Mormont": 1, "Velaryon": 1}}, {"t": "Being outwitted", "w": {"Lannister": 2, "Tyrell": 2, "Frey": 1}}]}, {"q": "A woman of your house wants to command men at arms. Do you?", "a": [{"t": "I give her a sword and no more doubts", "w": {"Mormont": 3, "Martell": 1, "Greyjoy": 1}}, {"t": "I support her if she's capable", "w": {"Stark": 1, "Targaryen": 2, "Tyrell": 1, "Velaryon": 1}}, {"t": "I prefer subtler ways for her to hold power", "w": {"Lannister": 2, "Hightower": 2, "Frey": 1}}, {"t": "Tradition says otherwise, and tradition matters", "w": {"Tully": 1, "Arryn": 2, "Tarly": 2, "Bracken": 1}}]}, {"q": "What does \"home\" mean to you?", "a": [{"t": "The walls where I grew up and the dead buried there", "w": {"Stark": 3, "Arryn": 1, "Mormont": 1}}, {"t": "The people, wherever they may be", "w": {"Tully": 3, "Baratheon": 1}}, {"t": "The name and everything owed to it", "w": {"Lannister": 2, "Hightower": 2, "Targaryen": 1, "Frey": 1}}, {"t": "The deck of the ship: home is wherever I'm going", "w": {"Greyjoy": 3, "Velaryon": 2}}]}, {"q": "A weaker rival is at your mercy, begging for mercy. Do you?", "a": [{"t": "I grant mercy: crushing the weak brings no glory", "w": {"Stark": 1, "Tully": 2, "Mormont": 2, "Baratheon": 1}}, {"t": "I grant it, but at a price he'll pay for a long time", "w": {"Lannister": 2, "Frey": 2, "Hightower": 1}}, {"t": "Mercy is a luxury the enemy hasn't earned", "w": {"Bolton": 3, "Clegane": 2, "Greyjoy": 1}}, {"t": "I decide based on what serves me tomorrow", "w": {"Tyrell": 2, "Targaryen": 1, "Bracken": 1, "Martell": 1}}]}, {"q": "Which of these flaws do you recognize most easily in yourself?", "a": [{"t": "I'm too rigid", "w": {"Stark": 2, "Tarly": 2, "Arryn": 1}}, {"t": "I'm too proud", "w": {"Martell": 2, "Targaryen": 2, "Lannister": 1, "Baratheon": 1}}, {"t": "I'm too calculating", "w": {"Frey": 2, "Bolton": 2, "Hightower": 1, "Lannister": 1}}, {"t": "I'm too impulsive", "w": {"Umber": 2, "Clegane": 2, "Greyjoy": 1, "Bracken": 1}}]}, {"q": "How do you choose your allies?", "a": [{"t": "By trust proven over years", "w": {"Stark": 2, "Tully": 2, "Velaryon": 1}}, {"t": "By what they can give me now", "w": {"Frey": 3, "Lannister": 1, "Bracken": 1}}, {"t": "By who hates the same enemies as me", "w": {"Blackwood": 2, "Martell": 2, "Bracken": 1, "Umber": 1}}, {"t": "By the prestige they bring me", "w": {"Tyrell": 2, "Hightower": 2, "Targaryen": 1}}]}, {"q": "A maester offers to let you study one discipline in depth. Which?", "a": [{"t": "History and archives", "w": {"Hightower": 3, "Lannister": 1}}, {"t": "Military strategy", "w": {"Tarly": 3, "Bolton": 1, "Baratheon": 1}}, {"t": "Navigation and distant seas", "w": {"Velaryon": 3, "Greyjoy": 1}}, {"t": "The art of reading people", "w": {"Tyrell": 2, "Lannister": 1, "Martell": 1, "Frey": 1}}]}, {"q": "Your reaction to a great injustice suffered by others?", "a": [{"t": "I step in, even at my own risk", "w": {"Baratheon": 2, "Stark": 2, "Mormont": 1, "Umber": 1}}, {"t": "I weigh whether stepping in serves me", "w": {"Frey": 2, "Lannister": 2, "Hightower": 1}}, {"t": "I remember it, and wait for the moment to set it right", "w": {"Martell": 2, "Blackwood": 2, "Bracken": 1, "Bolton": 1}}, {"t": "It's none of my business unless it touches my own", "w": {"Greyjoy": 2, "Arryn": 2, "Velaryon": 1}}]}, {"q": "What legacy would you want to leave?", "a": [{"t": "Untouched lands and a name without stain", "w": {"Stark": 2, "Arryn": 2, "Tarly": 1}}, {"t": "A dynasty that lasts a thousand years", "w": {"Lannister": 2, "Targaryen": 2, "Hightower": 1, "Frey": 1, "Blackfyre": 1}}, {"t": "A fleet and routes that carry my name far", "w": {"Velaryon": 3, "Greyjoy": 2}}, {"t": "The memory of one who never surrendered", "w": {"Martell": 2, "Blackwood": 1, "Umber": 1, "Baratheon": 1}}]}, {"q": "You notice a peer of yours cheating at an important game. Do you?", "a": [{"t": "I expose him in front of everyone", "w": {"Stark": 2, "Baratheon": 2, "Umber": 1, "Tully": 1}}, {"t": "I let it be and learn his moves", "w": {"Lannister": 2, "Bolton": 2, "Hightower": 1}}, {"t": "I cheat better than him", "w": {"Frey": 2, "Tyrell": 1, "Bracken": 1, "Targaryen": 1}}, {"t": "I overturn the table", "w": {"Clegane": 3, "Greyjoy": 1}}]}, {"q": "What do you think of forgiveness?", "a": [{"t": "It's strength, not weakness", "w": {"Tully": 2, "Stark": 1, "Tyrell": 1, "Baratheon": 1}}, {"t": "It should only be granted when it serves a purpose", "w": {"Lannister": 2, "Hightower": 2, "Frey": 1}}, {"t": "Some things are never forgiven", "w": {"Bracken": 2, "Blackwood": 2, "Martell": 2, "Bolton": 1, "Blackfyre": 2}}, {"t": "To forgive is to forget, and I don't forget", "w": {"Greyjoy": 1, "Umber": 1, "Targaryen  1}}, {"t": "I use it: whoever flatters is easy to manipulate", "w": {"Frey": 2, "Tyrell": 1, "Bolton": 1, "Bracken": 1}}]}, {"q": "What price would you never pay, for any throne?", "a": [{"t": "My word and my honor", "w": {"Stark": 3, "Mormont": 1, "Tarly": 1}}, {"t": "The safety of my own", "w": {"Tully": 3, "Velaryon": 1, "Mormont": 1}}, {"t": "My freedom to never kneel", "w": {"Greyjoy": 2, "Martell": 2, "Blackwood": 1, "Baratheon": 1}}, {"t": "None: for the right throne I'd pay any price", "w": {"Targaryen": 2, "Lannister": 2, "Frey": 1, "Bolton": 1, "Blackfyre": 2}}]}, {"q": "An old family rival outdoes you at everything. What burns you most?", "a": [{"t": "That it's them, of all people, who come out on top", "w": {"Bracken": 3, "Blackwood": 3}}, {"t": "That my name slips into the shadows", "w": {"Lannister": 1, "Targaryen": 1, "Hightower": 2, "Tyrell": 1, "Blackfyre": 2}}, {"t": "Nothing: envy is a waste of time", "w": {"Stark": 1, "Mormont": 2, "Arryn": 1, "Velaryon": 1}}, {"t": "That I can't confront them openly", "w": {"Umber": 2, "Baratheon": 2, "Greyjoy": 1, "Clegane": 1}}]}, {"q": "How do you make difficult decisions?", "a": [{"t": "Alone, in silence, after long reflection", "w": {"Stark": 2, "Bolton": 2, "Arryn": 1, "Hightower": 1}}, {"t": "By consulting those I trust most", "w": {"Tully": 2, "Velaryon": 2, "Tarly": 1, "Mormont": 1}}, {"t": "By gut instinct: I'm usually right", "w": {"Baratheon": 2, "Bracken": 2, "Umber": 1, "Greyjoy": 1}}, {"t": "By weighing every possible advantage", "w": {"Lannister": 2, "Frey": 2, "Tyrell": 1, "Targaryen": 1}}]}, {"q": "Which childhood memory sounds most familiar to you?", "a": [{"t": "Learning to wield a weapon before learning to read", "w": {"Umber": 2, "Mormont": 2, "Clegane": 1, "Bracken": 1, "Greyjoy": 1}}, {"t": "Hours spent among books and tutors", "w": {"Hightower": 3, "Lannister": 1, "Tyrell": 1}}, {"t": "Being told how ancient and great my name was", "w": {"Targaryen": 2, "Hightower": 1, "Frey": 1, "Velaryon": 1, "Martell": 1, "Blackfyre": 2}}, {"t": "Playing freely among woods and courtyards", "w": {"Stark": 2, "Tully": 2, "Baratheon": 1}}]}, {"q": "What would you do if you discovered your entire fortune rests on an old lie?", "a": [{"t": "I'd reveal it: living in truth matters more than fortune", "w": {"Stark": 2, "Tarly": 1, "Tully": 1, "Mormont": 1}}, {"t": "I'd bury it even deeper", "w": {"Lannister": 2, "Frey": 2, "Hightower": 1, "Bolton": 1}}, {"t": "I'd turn it into an even greater legend", "w": {"Targaryen": 2, "Tyrell": 2, "Velaryon": 1, "Blackfyre": 1}}, {"t": "Nothing would change: power is power", "w": {"Bolton": 1, "Greyjoy": 2, "Bracken": 1, "Clegane": 1}}]}, {"q": "Winter is coming and will last for years. How do you prepare?", "a": [{"t": "I fill the granaries and organize every resource methodically", "w": {"Stark": 3, "Tarly": 1, "Tully": 1}}, {"t": "I buy everything needed, everywhere, at any price", "w": {"Lannister": 2, "Hightower": 2, "Frey": 1, "Velaryon": 1}}, {"t": "I'll take what's needed from those who didn't prepare", "w": {"Greyjoy": 3, "Bracken": 1, "Bolton": 1}}, {"t": "Winter doesn't scare me: my people are tough", "w": {"Umber": 2, "Mormont": 2, "Stark": 1}}]}, {"q": "Which sounds more like a compliment and which like an insult? Choose what defines you most:", "a": [{"t": "\"You're predictable\" — and that's fine, because I'm reliable", "w": {"Stark": 2, "Tully": 1, "Tarly": 2, "Mormont": 1}}, {"t": "\"You're ruthless\" — and I take it as a fact, not an accusation", "w": {"Bolton": 3, "Clegane": 1, "Greyjoy": 1}}, {"t": "\"You're unpredictable\" — exactly what I want to be", "w": {"Lannister": 1, "Tyrell": 2, "Martell": 1, "Bracken": 1, "Targaryen": 1}}, {"t": "\"You're stubborn\" — call it what you want, I don't give up", "w": {"Umber": 2, "Blackwood": 1, "Bracken": 1, "Baratheon": 1, "Martell": 1}}]}, {"q": "Finally: what would you want people to feel when they say your name?", "a": [{"t": "Respect and trust", "w": {"Stark": 2, "Tully": 2, "Arryn": 1, "Mormont": 1, "Velaryon": 1}}, {"t": "Awe at greatness", "w": {"Targaryen": 2, "Hightower": 2, "Lannister": 1, "Tyrell": 1, "Blackfyre": 1}}, {"t": "A shiver of fear", "w": {"Bolton": 2, "Clegane": 2, "Greyjoy": 1, "Bracken": 1}}, {"t": "The warmth of knowing I'll be there", "w": {"Tully": 1, "Baratheon": 2, "Umber": 2, "Mormont": 1}}]}, {"q": "A falcon lands on your arm during a tense council. What do you do?", "a": [{"t": "I leave it be and carry on: calm is worth more than any gesture", "w": {"Arryn": 3, "Hightower": 1, "Stark": 1}}, {"t": "I stroke it and use it to break the tension in my favor", "w": {"Tyrell": 2, "Lannister": 1, "Martell": 1, "Arryn": 1}}, {"t": "I shoo it away: there's no time for such distractions", "w": {"Tarly": 2, "Bolton": 1, "Baratheon": 1, "Clegane": 1}}, {"t": "I think it's an omen and try to read it", "w": {"Blackwood": 3, "Targaryen": 1, "Arryn": 1}}]}, {"q": "You're asked to guard a remote border forgotten for years. Do you?", "a": [{"t": "I accept with pride: borders are defended regardless", "w": {"Mormont": 2, "Umber": 2, "Arryn": 2, "Stark": 1}}, {"t": "I try to trade it for a more visible posting", "w": {"Frey": 2, "Lannister": 1, "Tyrell": 1, "Hightower": 1}}, {"t": "I turn it into a base for my ambitions", "w": {"Bolton": 2, "Greyjoy": 1, "Bracken": 1, "Targaryen": 1, "Velaryon": 1, "Blackfyre": 2}}, {"t": "I only accept if it truly protects someone I care about", "w": {"Tully": 2, "Velaryon": 2, "Stark": 1, "Mormont": 1}}]}, {"q": "You have a single wish that will certainly come true. What do you ask for?", "a": [{"t": "That my people be safe for generations", "w": {"Stark": 2, "Tully": 2, "Mormont": 1, "Velaryon": 1, "Arryn": 1}}, {"t": "That my old enemy finally fall", "w": {"Bracken": 2, "Blackwood": 2, "Clegane": 2, "Martell": 1, "Blackfyre": 2}}, {"t": "That my name become immortal", "w": {"Targaryen": 2, "Lannister": 1, "Hightower": 2, "Tyrell": 1, "Blackfyre": 1}}, {"t": "The open sea and no master above me", "w": {"Greyjoy": 3, "Velaryon": 2, "Baratheon": 1}}]}], "houses": {"Stark": {"motto": "Winter Is Coming", "sigil": "A grey direwolf on an ice-white field", "blurb": "Ancient Kings of the North, faithful to the old gods and to an honor as harsh as the snow. For you duty isn't a choice but the backbone of who you are: you pass the sentence and swing the sword yourself. You distrust the southern court and its intrigues, and your place will always be within your own walls, beside your people."}, "Lannister": {"motto": "Hear Me Roar!", "sigil": "A golden lion on a crimson field", "blurb": "Descendant of Lann the Clever, as rich as the mines of Casterly Rock. You keep count of every debt and every credit, and a Lannister always pays his debts — in gold or otherwise. Patience, pride, and calculation: you let others think you predictable while your plan ripens in the shadows."}, "Targaryen": {"motto": "Fire and Blood", "sigil": "A red three-headed dragon on a black field", "blurb": "Blood of ancient Valyria, used to looking down on the world from above. Ambition runs through your veins like fire: you want a name time cannot erase. Prophecies and great deeds call to you, and what you truly desire, you take."}, "Arryn": {"motto": "As High as Honor", "sigil": "A white falcon and moon on a sky-blue field", "blurb": "Lord of the Eyrie, the impregnable castle among the clouds. Cautious, patient, jealous of your safety: you don't open closed doors without good reason, and you don't take needless risks. To you honor is an altitude — something to strive toward, not a showy gesture."}, "Tyrell": {"motto": "Growing Strong", "sigil": "A golden rose on a grass-green field", "blurb": "Risen from stewards to the throne of Highgarden through courtesy and skill. You know the people's affection is power and a smile disarms more than a sword. You cultivate alliances the way one tends a garden: with patience, elegance, and an eye always on what will bloom."}, "Martell": {"motto": "Unbowed, Unbent, Unbroken", "sigil": "A red sun pierced by a spear", "blurb": "Princes of Dorne, unbroken beneath their fierce sun. No dragon ever bent your knee. Proud and independent, you never forget a wrong and serve your revenge cold, when the moment is perfect. You set your own rules, and never kneel to anyone who hasn't earned it."}, "Baratheon": {"motto": "Ours Is the Fury", "sigil": "A crowned black stag on a golden field", "blurb": "Strong as the storm that batters Storm's End. You face everything head-on: battle, insult, life itself. Brave, blunt, incapable of pretending — you'd rather have one decisive battle face to face than a thousand intrigues. You drink, laugh, and fight with all your heart."}, "Tully": {"motto": "Family, Duty, Honor", "sigil": "A silver trout on a field of blue and red", "blurb": "Lords of Riverrun, where the rivers meet. For you, people come first: you open the granaries in famine, keep secrets, and end feuds. Family isn't only blood but everyone who depends on you — and you never let them down."}, "Greyjoy": {"motto": "We Do Not Sow", "sigil": "A golden kraken on a black field", "blurb": "Ironborn of the islands, proud of their fierce freedom. You do not sow: you take what you need from the sea and from those too weak to keep it. Home is the deck of your ship, and what is dead may never die. No master, no chains."}, "Hightower": {"motto": "We Light the Way", "sigil": "A stone tower crowned with flame on a grey field", "blurb": "The oldest and richest house of Oldtown, keeper of the Citadel and its knowledge. Prudent and devout, you open doors when force is useless and hold your books the way others hold swords. You know patient knowledge outlives every conqueror."}, "Velaryon": {"motto": "The Old, the True, the Brave", "sigil": "A silver seahorse on a field of sea-blue", "blurb": "Ancient Valyrian blood tied to the sea more than the land. You are first to explore dangerous routes, building fleets that carry your name beyond the horizon. Loyal and brave, your home is wherever the tide takes you, and your wealth comes from the waves."}, "Bolton": {"motto": "Our Blades Are Sharp", "sigil": "A flayed man on a field of blood-pink", "blurb": "Ancient lords of the Dreadfort, with a reputation as feared as it is old. Cold, patient, calculating: a naked man has few secrets, you say, and you know something about that. You never show weakness, never grant mercy for free, and let your name do fear's work."}, "Tarly": {"motto": "First in Battle", "sigil": "A huntsman striding across a green and silver field", "blurb": "Lords of Horn Hill, famed for martial discipline. For you, order, training, and strategy win wars. Strict with yourself before others, you temper heirs with hard trials and command the maneuver while others chase the glory of the front line."}, "Mormont": {"motto": "Here We Stand", "sigil": "A black bear on a green field", "blurb": "From the rugged Bear Island, where even women wield the sword and no one argues about it. Blunt, loyal, tireless: what matters to you is what someone does, not where they're from. You bear pain without complaint, defend forgotten borders, and hold your ground no matter what happens."}, "Clegane": {"motto": "(no noble motto — just three black dogs on a yellow field)", "sigil": "Three black dogs on a yellow field", "blurb": "A young, violent house, raised serving through brute force. You answer insults with your fists, break down doors instead of going around them, and use pain as fuel for your rage. Direct to the point of brutality, you scorn the subtleties and false courtesy of court."}, "Bracken": {"motto": "No one knows which (the rivalry is eternal)", "sigil": "A red horse and golden sun on a brown field", "blurb": "Lords of the riverlands, bound by an ancient, unquenchable feud with the Blackwoods. Impulsive, proud, unable to let a wrong go: certain grudges last as long as your name. You face enemies openly, and what burns you most is watching them, of all people, come out on top."}, "Blackwood": {"motto": "(keepers of the old gods and the weirwood)", "sigil": "A flock of ravens and a weirwood tree on a red field", "blurb": "Ancient lords of the riverlands, faithful to the old gods and sworn enemies of the Brackens. You read omens, listen to the silence of the trees, and never forget an offense. You strike where you're not expected and carry your grudges with the same care you keep old traditions."}, "Umber": {"motto": "(the raw strength of the Greatjon)", "sigil": "A giant breaking chains on a silver field", "blurb": "Bannermen of the Starks from the far North, huge, loud, and fierce. Stubborn and impulsive, you say things as they are and face life head-on. You learn to wield a weapon before you even learn to read, and your loyalty, once given, is as unbreakable as ice."}, "Frey": {"motto": "(no ancient motto — they rose with the Crossing)", "sigil": "Two towers joined by a bridge on a field of silver and blue", "blurb": "Lords of the Crossing, masters of the Twins and of everyone who wants to cross the river. Opportunistic and tenacious, you keep precise count of every favor and every slight. You know you don't have the oldest blood, and precisely for that reason you never let a chance to rise slip by."}, "Blackfyre": {"motto": "(the black dragon — the Targaryen colors reversed)", "sigil": "A black three-headed dragon on a red field", "blurb": "Dragon's blood, but born on the wrong side of the succession: you descend from Daemon Blackfyre, the legitimized bastard who wielded the Conqueror's sword and claimed a throne he believed rightfully his. Proud and relentless, you carry the weight of an exclusion that has burned for generations. Four failed rebellions haven't extinguished your conviction: exile beyond the Narrow Sea, the Golden Company at your side, and a grudge that knows no surrender. What was denied you, you will return to claim."}}}, "fr": {"quiz": [{"q": "Un invité se présente à ton portail pendant une tempête. Tu ne le connais pas, et la rumeur dit qu'il serait un ennemi. Que fais-tu ?", "a": [{"t": "Je l'accueille : le pain et le sel ne se refusent à personne", "w": {"Stark": 3, "Tully": 2, "Umber": 2, "Mormont": 1}}, {"t": "Je l'accueille, mais je le fais surveiller à chaque instant", "w": {"Bolton": 3, "Frey": 2, "Lannister": 1, "Hightower": 1}}, {"t": "Je l'accueille et le mets à l'aise : un ennemi désarmé est le plus facile à écouter", "w": {"Tyrell": 3, "Martell": 2, "Lannister": 1}}, {"t": "C'est moi qui fixe les règles sous mon toit, invité ou non", "w": {"Greyjoy": 3, "Baratheon": 1, "Bracken": 1}}]}, {"q": "On t'offre un siège de pouvoir à la cour, loin de chez toi. Acceptes-tu ?", "a": [{"t": "Non, ma place est sur mes terres", "w": {"Stark": 3, "Mormont": 2, "Arryn": 1}}, {"t": "Oui, c'est près du roi que se décide le sort du royaume", "w": {"Lannister": 3, "Tyrell": 2, "Hightower": 1, "Frey": 1}}, {"t": "Seulement si cela garantit une meilleure protection pour les miens", "w": {"Tully": 3, "Velaryon": 1, "Tarly": 1}}, {"t": "Je le prendrais quand même, et j'en userais à ma façon", "w": {"Targaryen": 2, "Baratheon": 2, "Bracken": 2, "Blackfyre": 2}}]}, {"q": "Quel bruit préfères-tu entendre au réveil ?", "a": [{"t": "Le vent dans les arbres et le silence", "w": {"Stark": 3, "Blackwood": 2, "Arryn": 1}}, {"t": "Les vagues qui battent la coque", "w": {"Greyjoy": 3, "Velaryon": 3}}, {"t": "Un château qui s'anime pour me servir", "w": {"Lannister": 2, "Tyrell": 2, "Frey": 1, "Hightower": 1}}, {"t": "Des chiens qui aboient dans les chenils", "w": {"Clegane": 3, "Bolton": 2, "Bracken": 1}}]}, {"q": "Un de tes vassaux t'a trahi. Il est en ton pouvoir. Comment procèdes-tu ?", "a": [{"t": "J'exécute la sentence moi-même : qui prononce la condamnation doit tenir l'épée", "w": {"Stark": 3, "Mormont": 2, "Umber": 1}}, {"t": "Je fais durer les choses, pour que d'autres apprennent", "w": {"Bolton": 3, "Clegane": 2}}, {"t": "Je le gracie publiquement et je m'en sers pour toujours", "w": {"Tyrell": 2, "Lannister": 2, "Martell": 1, "Frey": 1}}, {"t": "Je le noie : le Dieu Noyé prend ce qui lui revient", "w": {"Greyjoy": 3}}]}, {"q": "Laquelle te semble la pire des humiliations ?", "a": [{"t": "S'agenouiller devant qui ne le mérite pas", "w": {"Martell": 3, "Greyjoy": 2, "Blackwood": 1, "Baratheon": 1}}, {"t": "Être pris pour un parvenu, sans véritable lignée", "w": {"Tyrell": 2, "Hightower": 2, "Frey": 2}}, {"t": "Voir son propre nom tomber dans l'oubli", "w": {"Targaryen": 2, "Lannister": 2, "Velaryon": 1, "Blackfyre": 2}}, {"t": "Être traité en sot quand on est le plus fort", "w": {"Clegane": 2, "Umber": 2, "Bracken": 2}}]}, {"q": "Tu as une soirée libre et aucun devoir. Comment la passes-tu ?", "a": [{"t": "Avec un livre rare et une bougie", "w": {"Hightower": 3, "Tyrell": 1, "Lannister": 1}}, {"t": "À m'entraîner jusqu'à ce que mes bras cèdent", "w": {"Tarly": 2, "Mormont": 2, "Baratheon": 2, "Clegane": 1}}, {"t": "À boire et chanter avec ceux qui me sont fidèles", "w": {"Baratheon": 2, "Umber": 2, "Tully": 1, "Bracken": 1}}, {"t": "À regarder l'horizon et préparer le prochain voyage", "w": {"Velaryon": 3, "Targaryen": 1, "Greyjoy": 1}}]}, {"q": "Quelle qualité apprécies-tu le plus chez ceux qui te servent ?", "a": [{"t": "Une loyauté absolue, même dans l'erreur", "w": {"Stark": 2, "Tully": 2, "Mormont": 2, "Umber": 1}}, {"t": "Une compétence froide, sans besoin d'affection", "w": {"Bolton": 3, "Tarly": 2, "Hightower": 1}}, {"t": "La capacité à être utile sans jamais devenir indispensable", "w": {"Lannister": 2, "Frey": 2, "Tyrell": 1}}, {"t": "Le courage physique, quel qu'en soit le prix", "w": {"Baratheon": 2, "Clegane": 2, "Greyjoy": 1, "Bracken": 1}}]}, {"q": "Une vieille querelle familiale pourrait enfin se refermer grâce à un mariage. Toi ?", "a": [{"t": "Je la referme : le sang versé ne vaut pas plus de sang", "w": {"Tully": 2, "Stark": 2, "Velaryon": 1}}, {"t": "Je la referme en apparence, et je garde la méfiance vivante", "w": {"Frey": 3, "Bolton": 1, "Lannister": 1}}, {"t": "Je ne la refermerais jamais : certains torts ne s'oublient pas", "w": {"Blackwood": 3, "Bracken": 3, "Martell": 1}}, {"t": "Je m'en sers pour obtenir quelque chose de plus grand", "w": {"Tyrell": 2, "Hightower": 2, "Targaryen": 1}}]}, {"q": "Comment réagis-tu à une insulte publique ?", "a": [{"t": "Avec un calme glacial : celui qui insulte s'est déjà trahi", "w": {"Bolton": 2, "Hightower": 2, "Arryn": 1, "Stark": 1}}, {"t": "Je réponds aussitôt, à coups de poing si nécessaire", "w": {"Clegane": 2, "Umber": 2, "Baratheon": 2, "Bracken": 1}}, {"t": "Je souris et je note pour plus tard", "w": {"Lannister": 2, "Tyrell": 2, "Martell": 1, "Frey": 1}}, {"t": "Je l'ignore : mon nom parle de lui-même", "w": {"Targaryen": 2, "Martell": 2, "Velaryon": 1}}]}, {"q": "Quel paysage sens-tu le plus \"tien\" ?", "a": [{"t": "Des forêts enneigées et des ciels gris", "w": {"Stark": 3, "Umber": 2, "Mormont": 1}}, {"t": "Des côtes rocheuses battues par la mer", "w": {"Greyjoy": 3, "Velaryon": 2, "Arryn": 1}}, {"t": "Des champs dorés et des jardins en fleurs", "w": {"Tyrell": 3, "Tully": 1}}, {"t": "Un désert rouge sous un soleil féroce", "w": {"Martell": 3}}]}, {"q": "Tu dois choisir une arme pour le reste de ta vie. Laquelle ?", "a": [{"t": "Une épée à deux mains qui exige une force pure", "w": {"Clegane": 2, "Umber": 2, "Baratheon": 2, "Tarly": 1}}, {"t": "Un arc long, pour frapper avant d'être vu", "w": {"Blackwood": 2, "Bracken": 1, "Tarly": 1, "Bolton": 1}}, {"t": "Une lame fine et rapide", "w": {"Martell": 2, "Lannister": 1, "Targaryen": 1}}, {"t": "La hache et le navire qui me mène à l'ennemi", "w": {"Greyjoy": 3, "Velaryon": 1}}]}, {"q": "Un barde écrit une ballade sur toi. Qu'espères-tu qu'elle dise ?", "a": [{"t": "Que j'ai fait mon devoir jusqu'au bout", "w": {"Stark": 3, "Tully": 2, "Tarly": 1, "Mormont": 1}}, {"t": "Que personne ne m'a jamais brisé", "w": {"Martell": 3, "Greyjoy": 2, "Blackwood": 1}}, {"t": "Que j'étais le plus rusé de tous", "w": {"Lannister": 3, "Frey": 1, "Tyrell": 1}}, {"t": "Que mon nom inspirait la terreur", "w": {"Bolton": 3, "Clegane": 2, "Targaryen": 1}}]}, {"q": "Combien l'argent compte-t-il pour toi ?", "a": [{"t": "C'est un outil : je l'accumule et je le fais fructifier", "w": {"Lannister": 3, "Hightower": 1, "Frey": 1}}, {"t": "Il compte moins que la terre et le nom", "w": {"Stark": 2, "Arryn": 2, "Mormont": 2}}, {"t": "Je le prends où je le trouve, je ne le cultive pas", "w": {"Greyjoy": 3, "Bracken": 1}}, {"t": "Il sert à financer des ambitions plus grandes que lui", "w": {"Targaryen": 2, "Velaryon": 2, "Baratheon": 1, "Tyrell": 1}}]}, {"q": "Un enfant de ta maison fait preuve de cruauté envers les animaux. Comment réagis-tu ?", "a": [{"t": "Je le corrige sévèrement : la cruauté gratuite est une faiblesse", "w": {"Stark": 2, "Tarly": 2, "Tully": 1, "Mormont": 1}}, {"t": "J'observe : peut-être comprend-il quelque chose que les autres ne voient pas", "w": {"Bolton": 3, "Clegane": 1}}, {"t": "Je lui apprends à la canaliser là où c'est utile", "w": {"Lannister": 1, "Targaryen": 1, "Bracken": 1, "Hightower": 1}}, {"t": "Je ne m'en occupe pas : il apprendra de la vie", "w": {"Greyjoy": 2, "Umber": 1, "Baratheon": 1}}]}, {"q": "Tu préférerais être...", "a": [{"t": "Craint", "w": {"Bolton": 3, "Targaryen": 1, "Clegane": 1, "Blackfyre": 1}}, {"t": "Respecté", "w": {"Stark": 2, "Arryn": 2, "Tarly": 2, "Hightower": 1}}, {"t": "Aimé", "w": {"Tully": 2, "Tyrell": 2, "Baratheon": 1, "Mormont": 1}}, {"t": "Libre", "w": {"Greyjoy": 3, "Martell": 2, "Blackwood": 1}}]}, {"q": "Ton héritier n'est pas fait pour gouverner. Que fais-tu ?", "a": [{"t": "Je le prépare quand même : le sang est le sang", "w": {"Frey": 2, "Targaryen": 2, "Lannister": 1, "Velaryon": 1, "Blackfyre": 2}}, {"t": "Je confie le pouvoir à qui en est capable, même hors de la lignée", "w": {"Tyrell": 2, "Hightower": 2, "Martell": 1}}, {"t": "Je le trempe par des épreuves dures jusqu'à ce qu'i
